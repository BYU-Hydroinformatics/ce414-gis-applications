site_name: CE 414 — Engineering Applications of GIS
site_description: Course materials for Civil Engineering 414 (Engineering Applications of GIS) at BYU
site_url: https://byu-hydroinformatics.github.io/ce414-gis-applications/
repo_url: https://github.com/BYU-Hydroinformatics/ce414-gis-applications
repo_name: BYU-Hydroinformatics/ce414-gis-applications

theme:
  name: material
  favicon: assets/favicon.png
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.integrate
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    logo: material/layers-triple

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/external-links.js

plugins:
  - search
  - gh-admonitions
  - glightbox:
      touchNavigation: true
      effect: zoom
      zoomable: true
      draggable: true
      auto_caption: false
      caption_position: bottom
      skip_classes:
        - tool-icon

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.tilde
  - pymdownx.superfences
  - toc:
      permalink: true

# The lab handouts and the final project are deliberately absent from nav: each is linked from the
# week page it is due in, so the menu stays a short list of weeks.
validation:
  nav:
    omitted_files: ignore

nav:
  - Course:
      - Overview: index.md
      - ArcGIS Tips and Reminders: arcgis-tips.md
      - Grading: policies/grading.md
      - AI Use Policy: policies/ai-policy.md
      - University Policies: policies/university.md
  - Schedule:
      - Overview: schedule/README.md
      - "Week 1 — Data Models Refresher": schedule/week-01.md
      - "Week 2 — ModelBuilder": schedule/week-02.md
      - "Week 3 — ModelBuilder and Raster Analysis": schedule/week-03.md
      - "Week 4 — Imagery": schedule/week-04.md
      - "Week 5 — Terrain Analysis": schedule/week-05.md
      - "Week 6 — Watershed Delineation": schedule/week-06.md
      - "Week 7 — Watershed Delineation, Part 3": schedule/week-07.md
      - "Week 8 — Interpolation and Midterm 1": schedule/week-08.md
      - "Week 9 — Interpolation, Part 3, and Web Services": schedule/week-09.md
      - "Week 10 — Raster-Based Spatial Analysis": schedule/week-10.md
      - "Week 11 — Least Cost Path and Coordinate Systems": schedule/week-11.md
      - "Week 12 — GPS and the Final Project": schedule/week-12.md
      - "Week 13 — Final Project Work": schedule/week-13.md
      - "Week 14 — Presentations and Midterm 2": schedule/week-14.md
      - "Week 15 — Final Project Presentations": schedule/week-15.md
