name: Deploy course site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material mkdocs-github-admonitions-plugin
      - run: mkdocs build --site-dir _site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build lecture slide decks (Marp)
        run: |
          npm install -g @marp-team/marp-cli
          shopt -s nullglob
          for md in slides/*/*.md; do
            out="_site/${md%.md}.html"
            mkdir -p "$(dirname "$out")"
            marp --theme slides/theme/ce414.css --html "$md" -o "$out"
          done
          for d in slides/*/images; do
            mkdir -p "_site/$(dirname "$d")"
            cp -r "$d" "_site/$(dirname "$d")/"
          done
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
