  <link rel="icon" type="image/png" href="../../assets/favicon.png">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="CE 414 in-class quiz: slope units and algorithms, aspect, curvature, hillshade, contours and viewsheds, all derived from a DEM.">

</head>
<body>
<div class="container" id="quizRoot"></div>
<script src="../lib/quiz.js"></script>
<script>
CE414Quiz.start({
  title: "Slope, Aspect, Viewshed",
  subtitle: "CE 414 &middot; Week 5 &mdash; Terrain Analysis<br>" +
            "Most surfaces today are <strong>raster in, raster out</strong>, computed from a moving " +
            "3 &times; 3 window; a viewshed is a line-of-sight raster. Six questions on what each " +
            "one actually reports.",
  badge: "Terrain question",
  deckUrl: "../../slides/week-05/terrain-analysis.html",
  questions: [
    {
      prompt: "Contour lines crowd together on one side of a map and spread far apart on the other. What is the spacing telling you?",
      options: [
        "Steeper ground where they crowd",
        "Higher elevation where they crowd",
        "A smaller contour interval where they crowd",
        "More accurate survey data where they crowd"
      ],
      answer: "Steeper ground where they crowd",
      explanation: "Contours are connected lines of uniform elevation that run at right angles to local slope, and the interval is chosen once for the whole map. With the vertical step fixed, tight spacing means the same rise happens over a shorter run — steeper ground. That is why a contour map carries slope information a flat color ramp does not."
    },
    {
      prompt: "Shaded relief (hillshade) is best described as:",
      options: [
        "A measurement of the surface, in the same sense as slope",
        "A picture of the surface, lit from an assumed sun"
      ],
      answer: "A picture of the surface, lit from an assumed sun",
      explanation: "A hillshade is a visualization effect: the surface is illuminated from an assumed sun azimuth and altitude, and the eye reads the shading as three-dimensional shape. Nothing in the output is a physical quantity you would put on a drawing — the illumination direction is a choice you made, and it decides which landforms stand out and which disappear."
    },
    {
      prompt: "The aspect raster reads 270 degrees at a cell. Which way does the ground fall away there?",
      options: ["North", "East", "South", "West"],
      answer: "West",
      explanation: "Aspect is the downhill direction of the steepest slope, reported as an azimuth clockwise from north: 0 and 360 are north, 90 is east, 180 is south, 270 is west. Note the direction is downhill — a west-facing slope at 270 degrees is the one that catches the afternoon sun."
    },
    {
      prompt: "Two standard slope methods, run on the same nine elevations, give 25.4 and 22.8 degrees. What does that tell you?",
      options: [
        "One of the two calculations has an arithmetic error",
        "The two methods must have used different cell sizes",
        "The method alone changes the slope",
        "One answer is in degrees and the other in percent"
      ],
      answer: "The method alone changes the slope",
      explanation: "Both are correct, and they disagree by 2.6 degrees. The four-nearest-cells method uses only the four cardinal neighbors and gives the diagonals zero weight; the third-order finite difference method uses all eight neighbors, weighting the cardinal ones double. Slope is not a property you read off the ground — it is what a particular window and weighting return, so record the method along with the number."
    },
    {
      prompt: "A viewshed run from a candidate tower site produces a raster. What does the cell value actually answer?",
      detail: "The question a viewshed actually answers.",
      options: [
        "How far each cell is from the viewpoint",
        "Whether each cell can be seen from the viewpoint",
        "How steep the ground is between the cell and the viewpoint",
        "How high above sea level each cell sits"
      ],
      answer: "Whether each cell can be seen from the viewpoint",
      explanation: "A viewshed is seen or not seen, cell by cell — sweep a line of sight out from the viewer and any cell that falls below the running maximum angle is hidden behind what came before it. It says nothing about distance or signal strength, so a cell can be visible and still be useless to serve."
    },
    {
      prompt: "You want to know which of five stops on a foothill hike can see the most of seven temples in the valley. What is the most efficient viewshed workflow?",
      detail: "The Utah County example from class.",
      options: [
        "Run one viewshed from each temple, add the seven rasters, and read the count at each stop",
        "Measure the straight-line distance from each stop to each temple",
        "Compute slope along the trail and pick the steepest stop",
        "Run a hillshade lit from each temple's direction"
      ],
      answer: "Run one viewshed from each temple, add the seven rasters, and read the count at each stop",
      explanation: "Line of sight works both ways: if a stop can see a temple, the temple can see the stop. Seven viewsheds, one from each temple raised to spire height, added together give every cell a count of temples visible, so every stop on the trail is answered at once. Distance and slope say nothing about whether a ridge is in the way, and a hillshade is only a picture."
    }
  ],
  perfectNote: "A perfect score. You can say what each derived surface reports and what it does not.",
  goodNote: "Solid. Read the explanations on the ones you missed — aspect and the slope algorithms are where the arguments start.",
  tryAgainNote: "Worth another pass. The short version: most surfaces here come from the same 3 × 3 window over the DEM, while a viewshed answers a line-of-sight question. Each output answers something different — how steep, which way downhill, how the slope bends, or what can be seen from where."
});
</script>
</body>
</html>
