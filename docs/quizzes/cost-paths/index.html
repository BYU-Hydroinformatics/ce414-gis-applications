  <title>CE 414 — What Moved the Line?</title>
  <link rel="icon" type="image/png" href="../../assets/favicon.png">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="CE 414 in-class quiz: the ArcGIS Pro least cost path tools, the back direction raster, which of Lab 10's weights actually move the route and why existing lines beat roads, and what a corridor shows.">

</head>
<body>
<div class="container" id="quizRoot"></div>
<script src="../lib/quiz.js"></script>
<script>
CE414Quiz.start({
  title: "What Moved the Line?",
  subtitle: "CE 414 &middot; Week 11 &mdash; Least Cost Path Analysis, Part B<br>" +
            "The algorithm is exact; the decisions are yours. For each item, decide " +
            "<strong>what the tool or the cost surface is doing</strong>.",
  badge: "Route call",
  deckUrl: "../../slides/week-11/least-cost-path-b.html",
  questions: [
    {
      prompt: "Which ArcGIS Pro tool gives you both the accumulated cost raster and the back direction raster?",
      options: [
        "Distance Accumulation",
        "Optimal Path As Raster",
        "Euclidean Distance",
        "Raster Calculator"
      ],
      answer: "Distance Accumulation",
      explanation: "Distance Accumulation writes the accumulated cost raster, and its Output Back Direction Raster parameter writes the back direction raster in the same run. Optimal Path As Line reads those two rasters and draws the route; Euclidean Distance ignores cost."
    },
    {
      prompt: "A cell of Distance Accumulation's back direction raster holds 90. What does that tell you?",
      options: [
        "The cell is 90 cost units from the source, in the cost raster's units",
        "Head east from here to get back to the source",
        "The route turns 90 degrees here"
      ],
      answer: "Head east from here to get back to the source",
      explanation: "The back direction is a compass angle: 0 marks the source itself, 90 is east, 180 south, 270 west, 360 north. It is a direction, not a cost; the accumulated cost raster holds the cost."
    },
    {
      prompt: "In Lab 10, raising Slope_Weight from 1 to 5 barely moves the route. Why so little?",
      options: [
        "Distance Accumulation ignores weights above 1",
        "The route runs on flat valley floor, where slope scores 1 almost everywhere a route could go",
        "Slope is measured in degrees, so its scores are too small to matter"
      ],
      answer: "The route runs on flat valley floor, where slope scores 1 almost everywhere a route could go",
      explanation: "A weight multiplies a score; if the score is the same along every route the line could take, multiplying it changes every route's cost alike and cannot choose between them. In mountains, slope would move the line."
    },
    {
      prompt: "Lab 10's route lies within 500 m of an existing transmission line for 99.7% of its length. Which change should move it most?",
      options: [
        "Setting Line_Weight to 0",
        "Removing the lake barrier",
        "Setting Line_Weight to 2"
      ],
      answer: "Setting Line_Weight to 0",
      explanation: "The existing-line score is what holds the route where it is. Remove it and the route leaves the lines and cuts across the valley, kilometers from the baseline: the biggest change of any. Weight 2 only holds it tighter, and the lakes were never in its way."
    },
    {
      prompt: "Dropping the road score moves Lab 10's route a little; dropping the existing-line score moves it kilometers. Why do the lines matter more here?",
      options: [
        "A major road runs near almost every route the line could take, so the road score barely tells those routes apart",
        "Roads are a barrier in Lab 10, so the route is never allowed near them and their score never counts",
        "Distance Accumulation counts the line score twice, once from each substation, so it outweighs roads"
      ],
      answer: "A major road runs near almost every route the line could take, so the road score barely tells those routes apart",
      explanation: "A weight moves the route only where its factor differs between candidate routes. Roads are everywhere on the valley floor, so the road score is about the same along any of them; existing lines are few, and the line score jumps from 1 to 5 just 500 m off one. Roads are not the most important factor in Lab 10: the existing lines are."
    },
    {
      prompt: "On a corridor map, a cell is shaded “within 5% of the cheapest.” What does that mean?",
      options: [
        "Its own cell cost is within 5% of the cheapest cell's cost",
        "It lies within 5% of the route's length from the route itself",
        "The best route through it costs at most 5% more"
      ],
      answer: "The best route through it costs at most 5% more",
      explanation: "Add the accumulated cost from the source to the accumulated cost from the destination: each cell gets the cost of the best route forced through it. Cells near the minimum are where a nearly-as-good route could go; that is how an engineer finds alternatives."
    }
  ],
  perfectNote:  "All six. On to Lab 10.",
  goodNote:     "Good. Reread the explanations you missed before you build the Lab 10 cost surface.",
  tryAgainNote: "The back direction raster is a compass angle, a score that is equal along every candidate route cannot move it (which is why the existing lines, not the roads, hold the route), and a corridor adds two accumulations. Look at those slides again."
});
</script>
</body>
</html>
