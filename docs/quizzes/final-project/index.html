  <meta name="description" content="CE 414 in-class quiz: five judgment calls about the final project — scope, requirements, the proposal meeting, and checking the result.">

<body>
<div class="container" id="quizRoot"></div>
<script src="../lib/quiz.js"></script>
<script>
CE414Quiz.start({
  title: "Ready to Pitch?",
  subtitle: "CE 414 &middot; Week 12 &mdash; The Final Project<br>" +
            "Five calls you have to make before you propose: is the idea the right " +
            "<strong>size</strong>, does it meet the <strong>requirements</strong>, and could you " +
            "<strong>defend the result</strong> if someone pushed back?",
  badge: "Project decision",
  deckUrl: "../../slides/week-12/final-project-introduction.html",
  questions: [
    {
      prompt: "Your partner opens with: \"Let's map every trailhead in Utah County and symbolize them by elevation.\"",
      detail: "One study area, data that certainly exists, a clean map at the end. Is it the right size for a final project?",
      options: [
        "Too small — it displays data, it analyzes nothing",
        "About right — one question, one area, one map",
        "Too big — county-wide is more than a project carries"
      ],
      answer: "Too small — it displays data, it analyzes nothing",
      explanation: "Mapping and symbolizing is display, not analysis: nothing is decided and there is no criterion to argue about. Turn it into a decision question — which trailheads are underserved by parking, say — and the same data becomes a project."
    },
    {
      prompt: "A team plans a siting analysis built entirely from parcels, roads, streams and zoning polygons.",
      detail: "Buffers, overlays and a selection at the end. Every layer is a feature class. Does the plan meet the project requirements?",
      options: [
        "Yes — the requirements are about rigor, not file types",
        "Yes, as long as the model has enough tools in it",
        "No — a project must use both raster and vector data"
      ],
      answer: "No — a project must use both raster and vector data",
      explanation: "Using both raster and vector is a stated requirement, and it is there for a reason: most real engineering questions mix measured surfaces with mapped features. Slope or land cover from a raster, combined with those parcels, is usually the cheapest way to satisfy it honestly."
    },
    {
      prompt: "Which of these best shows that your model \"exposes a tool interface\"?",
      detail: "Requirement 6 says your model should open like any other geoprocessing tool.",
      options: [
        "A classmate can run it on new data without opening it",
        "The model runs start to finish without throwing an error",
        "The model diagram is laid out neatly, left to right"
      ],
      answer: "A classmate can run it on new data without opening it",
      explanation: "That is the test on the slide, and it forces everything else: inputs and outputs marked as parameters, thresholds exposed rather than buried, labels a stranger can read instead of rivers_Project_Buffer_2, and metadata saying what the tool does, needs and makes."
    },
    {
      prompt: "Your team arrives at the proposal meeting with a sharp one-sentence question and a sketch of the model on paper. The data plan is \"we will find it next week.\"",
      detail: "Are you ready to pitch?",
      options: [
        "Yes — the analysis plan is what the proposal meeting is for",
        "Yes, provided the study area is already settled",
        "No — the data-feasibility table has to be filled in first"
      ],
      answer: "No — the data-feasibility table has to be filled in first",
      explanation: "Every layer needs a source and URL, a vintage, a format, a coordinate reference system, raster or vector, and a license before you pitch. Projects fail on a data row far more often than on the analysis, and a layer that turns out to be a PDF, a paywall or a decade old is much cheaper to discover now."
    },
    {
      prompt: "Asked \"what would a wrong answer look like?\", a team says the three sites their model picked are obviously the right ones.",
      detail: "What does that answer tell you about the project?",
      options: [
        "It is in good shape — an obvious result is one you can defend",
        "It cannot be checked, so it is a picture, not an analysis",
        "It needs a larger study area before the result means anything"
      ],
      answer: "It cannot be checked, so it is a picture, not an analysis",
      explanation: "A model with no validation or sensitivity check cannot be wrong, which means it also cannot be right. The cheapest check is to move one threshold and show what moves with it — if the same sites survive, you have an argument; if they do not, you have learned where your recommendation actually comes from."
    }
  ],
  perfectNote: "A clean sweep — you know what you are being asked for. Now go find the data.",
  goodNote: "Good. Reread the explanations you missed before your proposal meeting; each one is a way projects have gone wrong before.",
  tryAgainNote: "Worth another pass. The short version: one decision question, one study area, raster and vector, a ModelBuilder model someone else could run, documented data, and one honest check on the result."
});
</script>
</body>
</html>
