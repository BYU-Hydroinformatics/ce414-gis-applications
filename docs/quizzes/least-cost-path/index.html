  <title>CE 414 — Cheapest or Shortest?</title>
  <link rel="icon" type="image/png" href="../../assets/favicon.png">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="CE 414 in-class quiz: what a cost surface stores, what the accumulated cost and back link rasters each hold, and why the cheapest route is rarely the shortest one.">

<body>
<div class="container" id="quizRoot"></div>
<script src="../lib/quiz.js"></script>
<script>
CE414Quiz.start({
  title: "Cheapest or Shortest?",
  subtitle: "CE 414 &middot; Week 11 &mdash; Least Cost Path Analysis<br>" +
            "Eight questions on the &quot;virtual terrain&quot;: what a cost surface really stores, " +
            "what the two routing rasters each hold, and why the cheapest route is almost never " +
            "the shortest one.",
  badge: "Routing question",
  deckUrl: "../../slides/week-11/least-cost-path.html",
  questions: [
    {
      prompt: "What does one cell value in a cost surface represent?",
      options: [
        "How far the cell is from the source",
        "The cheapest route cost to that cell",
        "The elevation measured at that cell",
        "What it costs to cross that cell"
      ],
      answer: "What it costs to cross that cell",
      explanation: "A cost surface is not a map of distance. Each cell carries the price of crossing it, and a route's cost is the sum of what it pays cell by cell. The cheapest total cost of reaching a cell is a different raster — the accumulated cost — and elevation is only one of many things a cell's cost can be built from."
    },
    {
      prompt: "You reclassify each input raster before combining it. Which cells should end up with the high values?",
      detail: "Roads, rivers and lakes, cities, existing power lines, elevation — all reclassified, then combined with map algebra in the Raster Calculator.",
      options: [
        "The cells you least want to cross",
        "The cells you most want to follow",
        "The cells closest to the source point",
        "The cells closest to the destination"
      ],
      answer: "The cells you least want to cross",
      explanation: "In the virtual terrain, high means undesirable and low means desirable, and the algorithm looks for the smallest total. Reclassify with the sign backward and you get an exact answer to the wrong question: a route that hunts down every feature you meant to avoid."
    },
    {
      prompt: "A straight line from A to B crosses dark cells that cost 4; a stepped route around them stays on light cells that cost 1. Which statement holds?",
      options: [
        "The straight line is both shorter and cheaper",
        "The line is shorter; the detour is cheaper",
        "Both cost the same; they share endpoints",
        "The stepped route is both shorter and cheaper"
      ],
      answer: "The line is shorter; the detour is cheaper",
      explanation: "Length counts cells; cost sums what those cells charge. Detouring adds cells, but at 1 each instead of 4, so the longer route wins on price. That gap between shortest and cheapest is the entire reason for the analysis — if they were the same line you would just draw it."
    },
    {
      prompt: "Stepping diagonally to a neighboring cell, compared with stepping straight across to the cell beside it",
      options: [
        "Costs the same — a neighbor is a neighbor",
        "Costs less — it advances in two directions at once",
        "Costs more — the diagonal covers more ground",
        "Is not allowed; paths run along rows and columns"
      ],
      answer: "Costs more — the diagonal covers more ground",
      explanation: "A diagonal step crosses about the square root of 2 times the ground of an orthogonal one, so it is charged roughly that much more. Diagonal moves are perfectly legal — the back link raster codes all eight neighbors — they are just priced higher, which is why a least-cost path often comes out stepped instead of running clean diagonals."
    },
    {
      prompt: "What does each cell of the accumulated cost (cost distance) raster store?",
      options: [
        "The cheapest total cost of reaching that cell",
        "The cost of crossing that one cell alone",
        "Which neighbor to step to next toward the source",
        "The straight-line distance to the destination"
      ],
      answer: "The cheapest total cost of reaching that cell",
      explanation: "It is a running total, not a per-cell price: light cells are cheap to reach, dark cells are expensive. The values spread outward from the source in rough rings, bulging far where crossing is cheap and staying tight where it is expensive."
    },
    {
      prompt: "What is the back link (back direction) raster for?",
      options: [
        "It records what each cell cost to cross",
        "It holds the finished route as a polyline",
        "It holds the downhill direction from elevation",
        "It records which neighbor to step to next"
      ],
      answer: "It records which neighbor to step to next",
      explanation: "The accumulated cost raster says how much; the back link raster says which way, as a code from 0 to 8 naming a neighbor. Starting at the destination and following those codes cell by cell until you arrive at the source is the whole path-finding step — which is why the route is traced backward, destination to source."
    },
    {
      prompt: "The routing tool hands you a path that is one cell wide. What does the workflow do with it before you can symbolize and map it?",
      options: [
        "Reclassify the path raster first",
        "Convert the path into a polyline",
        "Add it back to the cost surface",
        "Nothing — map the raster as it is"
      ],
      answer: "Convert the path into a polyline",
      explanation: "The answer arrives as a raster, one cell wide, and a raster has no line symbology to give it — you cannot set a width, a color and a line style on it the way a map needs. Raster to Polyline is the last step of the Lab 11 model for exactly that reason."
    },
    {
      prompt: "Cost Distance, Cost Back Link, and Cost Path still run in ArcGIS Pro, but Esri has deprecated them. What are the current replacements?",
      options: [
        "Reclassify, then run the Raster Calculator",
        "Euclidean Distance, followed by Raster to Polyline",
        "Distance Accumulation, then Optimal Path As Line",
        "There is no replacement; they are the only option"
      ],
      answer: "Distance Accumulation, then Optimal Path As Line",
      explanation: "Distance Accumulation produces the accumulative cost raster and the back direction raster in one run, and Optimal Path As Line can hand you a polyline directly. Only names and a few parameters moved — the idea is unchanged. Lab 11's steps and rubric assume the legacy tools, so confirm in class which set to use before you start."
    }
  ],
  perfectNote: "Every one. You have the distinction the whole lab rests on: the algorithm is exact, but only about the cost surface you gave it.",
  goodNote: "Solid. Read the explanations you missed — the arguable ones are the ones Lab 11 will make you defend.",
  tryAgainNote: "Worth another pass. The short version: a cost surface prices each cell, the accumulated cost raster totals the cheapest way to reach each cell, the back link raster says which way to step home, and the cheapest route is rarely the shortest."
});
</script>
</body>
</html>
