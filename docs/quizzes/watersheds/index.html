<div class="container" id="quizRoot"></div>
<script src="../lib/quiz.js"></script>
<script>
CE414Quiz.start({
  title: "Which Way Does Water Go?",
  subtitle: "CE 414 &middot; Week 6 &mdash; Watershed Delineation, Part A<br>" +
            "Five questions, one per goal: what a watershed is, how they nest, the water balance, " +
            "why <strong>Fill</strong> comes first, and <strong>aspect</strong> against <strong>D8</strong>.",
  badge: "Watershed idea",
  deckUrl: "../../slides/week-06/watershed-delineation-a.html",
  questions: [
    {
      prompt: "Why did John Wesley Powell propose bringing the western states into the union along watershed boundaries?",
      options: [
        "So every state would have the same area",
        "So each state would hold the water it collects",
        "Because watershed lines were cheaper to survey",
        "So every state would reach a navigable river"
      ],
      answer: "So each state would hold the water it collects",
      explanation: "A watershed is the land that drains to one outlet, and water does not follow straight-line political boundaries: a watershed crosses city, state and national lines. Powell's map of the arid West drew states around drainage basins so that each would govern its own water. Congress drew rectangles instead, and a century of interstate water compacts and litigation followed."
    },
    {
      prompt: "The Rock Canyon trailhead sits in hydrologic unit 160202030505. What do the first four digits, 1602, tell you?",
      options: [
        "It is Utah's 1,602nd mapped watershed",
        "Its outlet sits at 1,602 m elevation",
        "It was mapped in version 16.02",
        "Its water reaches the Great Salt Lake"
      ],
      answer: "Its water reaches the Great Salt Lake",
      explanation: "Hydrologic unit codes nest: each level adds two digits to its parent. 16 is the Great Basin Region, 1602 the Great Salt Lake subregion, 160202 the Jordan basin, 16020203 the Provo subbasin, and so on down to the 12-digit subwatershed. The code says where the water goes."
    },
    {
      prompt: "Which term in a watershed's water balance can a DEM tell you about?",
      detail: "Change in storage = precipitation − evapotranspiration − streamflow − groundwater out.",
      options: [
        "How much precipitation falls",
        "How much water evaporates",
        "How much groundwater is stored",
        "Where the runoff will flow"
      ],
      answer: "Where the runoff will flow",
      explanation: "A DEM is a model of the ground surface, so it can tell you which way water on that surface will go: the flow paths, the divide and the outlet. How much rain falls, how much evaporates and how much is stored underground all need other data — gages, weather stations, soil and snow surveys."
    },
    {
      prompt: "Your DEM has a closed hollow where, in the field, there is a real pond with no outlet. What does Fill do to it?",
      detail: "Some pits are real sinks in the landscape; some are artifacts of how the DEM was made.",
      options: [
        "Raises it to its spill level",
        "Leaves it alone, because Fill detects real sinks",
        "Lowers the rim so that the pond can drain",
        "Sets the hollow's cells to NoData"
      ],
      answer: "Raises it to its spill level",
      explanation: "Fill cannot tell a real sink from an artifact: it raises every pit to the level where it would spill, so water can keep moving downhill. That is the right thing for most pits, which are artifacts, and the wrong thing for a real closed basin — which is why you need to know your landscape. Fill only ever raises cells; it never lowers a rim."
    },
    {
      prompt: "A cell's aspect is 250°, but its D8 flow direction code is 8. What does the 8 mean?",
      detail: "Esri codes: 1 east, 2 southeast, 4 south, 8 southwest, 16 west, 32 northwest, 64 north, 128 northeast.",
      options: [
        "Its slope toward the west is 8 degrees",
        "Eight upstream cells drain into it",
        "Its water all goes southwest",
        "Its water is split among 8 neighbors"
      ],
      answer: "Its water all goes southwest",
      explanation: "D8 is a simplified aspect: instead of any of 360 degrees, it picks the one of eight neighbors with the steepest drop from the center cell and writes that direction's code into the cell. The code is a label for a direction, not a measurement, so it cannot be averaged or compared as a size. Counting upstream cells is flow accumulation, the next step."
    }
  ],
  perfectNote: "A clean sweep — you know what a watershed is and which way water leaves every cell.",
  goodNote: "Solid. Read the explanations on the ones you missed; Thursday builds every step on the flow direction grid.",
  tryAgainNote: "Worth another pass. The short version: a watershed is everything that drains to one outlet, and the boundary is where water is managed and accounted for; Fill raises every pit, real or not; and D8 writes into each cell the code of the one neighbor its water goes to."
});
</script>
