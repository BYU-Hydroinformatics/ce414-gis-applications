  <meta name="description" content="CE 414 in-class quiz: what HAND measures, how it is computed, why the stream definition matters, and how to score a flood map.">

<body>
<div class="container" id="quizRoot"></div>
<script src="../lib/quiz.js"></script>
<script>
CE414Quiz.start({
  title: "Height Above What?",
  subtitle: "CE 414 &middot; Week 8 &mdash; Flood Mapping, Part A<br>" +
            "One depth floods a whole river. For each item, decide what the HAND model " +
            "<strong>is doing with the terrain</strong>.",
  badge: "HAND call",
  deckUrl: "../../slides/week-08/flood-models.html",
  questions: [
    {
      prompt: "What does a cell's HAND value measure?",
      options: [
        "Its elevation above sea level",
        "Its straight-line distance to the river",
        "Its drop to the stream it drains to"
      ],
      answer: "Its drop to the stream it drains to",
      explanation: "HAND follows the path the water takes (the flow direction) to the stream and measures the vertical drop along it. Sea level and straight-line distance ignore where the water actually goes."
    },
    {
      prompt: "Cell A is at 22.8 m and its water runs downhill to a river cell at 21.8 m. Cell B, farther down the valley, is at 22.0 m and drains to the river at 20.0 m. The river rises 1.5 m. Which cells flood?",
      options: [
        "Only B, because it is lower",
        "Only A",
        "Both, because both are within 3 m of the river",
        "Neither"
      ],
      answer: "Only A",
      explanation: "HAND is A's 22.8 − 21.8 = 1.0 m and B's 22.0 − 20.0 = 2.0 m. Only cells with HAND at most 1.5 m flood, so the higher cell floods and the lower one stays dry: what counts is the height above the river each cell drains to, not the elevation."
    },
    {
      prompt: "Which tool turns Lab 5's chain into HAND?",
      options: [
        "Flow Distance, vertical",
        "Flow Accumulation, with a weight raster",
        "Euclidean Distance to the river",
        "Raster Calculator subtracting a constant"
      ],
      answer: "Flow Distance, vertical",
      explanation: "Flow Distance measures along the flow path to the stream cells, and its vertical option gives the height difference: that is HAND. Euclidean Distance is horizontal and ignores flow; Flow Accumulation counts upstream cells."
    },
    {
      prompt: "You call every cell above an accumulation threshold a stream, with no river corridor. What happens to the 1% flood?",
      options: [
        "It shrinks, because the river is narrower",
        "It grows: every gully floods",
        "Nothing; HAND ignores the streams"
      ],
      answer: "It grows: every gully floods",
      explanation: "HAND is measured to whatever you call a stream. Make every gully a stream and every cell near a gully gets a small HAND, so one river depth floods them all; the stream definition is the biggest choice in the model."
    },
    {
      prompt: "A cell has HAND = 1.2 m. The flood depth h at the gage is 1.5 m. Is the cell flooded in the model?",
      options: [
        "No: a cell floods only when its HAND is above the flood depth",
        "Only if its elevation is below the gage",
        "It depends on its distance to the gage",
        "Yes: its HAND, 1.2 m, is below the 1.5 m flood depth"
      ],
      answer: "Yes: its HAND, 1.2 m, is below the 1.5 m flood depth",
      explanation: "The water rises 1.5 m above the stream, and this cell sits only 1.2 m above it, so it is under water. The model floods every cell with HAND less than or equal to h, one threshold for the whole river. Elevation and distance to the gage play no part; that is both HAND's strength and its limit."
    },
    {
      prompt: "Why is Lab 7 two models, HAND Builder and Flood Loop, instead of one?",
      options: [
        "A model can have only one parameter",
        "An iterator reruns every tool in its model, so one model would rebuild HAND for every flood",
        "Flow Distance cannot run inside a model with an iterator",
        "The stage table has to live in a different geodatabase"
      ],
      answer: "An iterator reruns every tool in its model, so one model would rebuild HAND for every flood",
      explanation: "An iterator drives every tool in its model, not just the ones after it. Put the HAND chain in the same model as the loop and Fill, Flow Direction, Flow Accumulation and Flow Distance run five times for one identical raster. Two models build HAND once and repeat only the cheap flooding steps; HAND is the one thing that passes between them."
    }
  ],
  perfectNote:  "All six. On to Lab 7.",
  goodNote:     "Good. Reread the explanations you missed before Lab 7, Step 3.",
  tryAgainNote: "HAND is the vertical drop to the stream a cell drains to, the stream definition drives it, a cell floods when HAND is at most h, and the slow HAND chain runs once, in its own model. Look at those slides again."
});
</script>
</body>
</html>
