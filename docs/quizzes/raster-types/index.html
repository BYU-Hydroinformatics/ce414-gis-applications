<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CE 414 — Categorical or Continuous?</title>
  <link rel="icon" type="image/png" href="../../assets/favicon.png">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="CE 414 in-class quiz: decide whether each raster dataset is categorical (discrete) or continuous.">
  <link rel="stylesheet" href="../lib/quiz.css">
</head>
<body>
<div class="container" id="quizRoot"></div>
<script src="../lib/quiz.js"></script>
<script>
CE414Quiz.start({
  title: "Categorical or Continuous?",
  subtitle: "CE 414 &middot; Week 3 &mdash; Raster Analysis and Map Algebra<br>" +
            "For each raster, decide what the cell value really is: a <strong>label</strong> " +
            "(categorical, also called discrete) or a <strong>measurement</strong> (continuous).",
  badge: "Raster dataset",
  deckUrl: "../../slides/week-03/raster-analysis-a.html",
  questions: [
    {
      prompt: "National Land Cover Database (NLCD)",
      detail: "Cells are classified into categories like Deciduous Forest, Developed High Intensity, or Open Water.",
      options: ["Categorical", "Continuous"],
      answer: "Categorical",
      explanation: "The values are discrete classes. The numbers stored (41 for forest, 11 for water) are nominal codes, not quantities — the average of 41 and 11 is not a land cover type."
    },
    {
      prompt: "Watershed identifier (HUC)",
      detail: "Cells tagged with the drainage basin they flow into.",
      options: ["Categorical", "Continuous"],
      answer: "Categorical",
      explanation: "A basin ID is a nominal label. Two adjacent cells in basins 16020202 and 16020203 are neighbors, not one unit apart in anything."
    },
    {
      prompt: "Normalized Difference Vegetation Index (NDVI)",
      detail: "The Lab 2 output: (NIR − red) ÷ (NIR + red), between −1.0 and +1.0.",
      options: ["Categorical", "Continuous"],
      answer: "Continuous",
      explanation: "NDVI is a ratio of measurements, so it is continuous. Note what happens in Lab 2: the moment you apply the threshold table, the continuous index becomes a categorical vegetation map."
    },
    {
      prompt: "Slope in degrees, straight from the Slope tool",
      detail: "Calculated from a DEM, ranging from 0° to 90°.",
      options: ["Categorical", "Continuous"],
      answer: "Continuous",
      explanation: "As calculated it is continuous. Reclassify it into gentle, moderate and steep for a suitability analysis and it becomes categorical — that is Lab 2 Step 3 in a different costume."
    },
    {
      prompt: "FEMA flood hazard zones",
      detail: "Areas designated Zone A (100-year floodplain), Zone X (minimal hazard), or regulatory floodway.",
      options: ["Categorical", "Continuous"],
      answer: "Categorical",
      explanation: "A regulatory flood map sorts risk into discrete zones. Contrast it with a water-surface-elevation or depth raster from a hydraulic model, which is continuous."
    }
  ],
  perfectNote: "A perfect score — you have the distinction that the whole week rests on.",
  goodNote: "Solid. Read the explanations for the ones you missed; they are the arguable ones on purpose.",
  tryAgainNote: "Worth another pass. The short version: a measurement you could average is continuous; a label standing in for a name is categorical."
});
</script>
</body>
</html>
