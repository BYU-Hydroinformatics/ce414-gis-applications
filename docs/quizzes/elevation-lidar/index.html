<div class="container" id="quizRoot"></div>
<script src="../lib/quiz.js"></script>
<script>
CE414Quiz.start({
  title: "Surfaces and Returns",
  subtitle: "CE 414 &middot; Week 5 &mdash; Elevation Data and LiDAR<br>" +
            "Five calls on where a surface <strong>comes from</strong> &mdash; how it is measured, " +
            "which one to download, and what the cell size costs you.",
  badge: "Elevation question",
  deckUrl: "../../slides/week-05/elevation-data-lidar.html",
  questions: [
    {
      prompt: "The elevation surface itself, or a model of it?",
      detail: "A grid of square cells in a coordinate system, each cell holding one land surface elevation, downloaded this morning from The National Map.",
      options: ["A DEM — a model of it", "The real elevation surface"],
      answer: "A DEM — a model of it",
      explanation: "The elevation surface is the real ground elevation at each point; a Digital Elevation Model is a digital representation of it. The square grid is only one way to build that representation — a triangular irregular network, a set of contours, or a scatter of points model the same surface differently, and the grid you downloaded also carries a row and column count, a cell size, an origin, and NODATA cells where it has no value."
    },
    {
      prompt: "What does a LiDAR sensor measure directly with each pulse?",
      options: [
        "The elevation of the ground below",
        "The slope of the surface below",
        "How long the pulse takes to return",
        "The color of whatever the pulse hit"
      ],
      answer: "How long the pulse takes to return",
      explanation: "Time of flight times the speed of light, divided by two, is the range from the sensor to whatever the pulse struck. A range is not yet a point: it becomes an (x, y, z) only once it is combined with the sensor's own position and orientation from GPS and an IMU — which is why LiDAR accuracy leans on the positioning system as hard as it leans on the laser."
    },
    {
      prompt: "One pulse over forest comes back more than once — treetop, branch, ground. Which of those echoes reaches the sensor last?",
      options: [
        "The treetop return",
        "The branch return",
        "They arrive together",
        "The ground return"
      ],
      answer: "The ground return",
      explanation: "The ground is the farthest thing the pulse reaches, so its echo makes the longest round trip and arrives last. That ordering is the whole trick: because some energy gets all the way through the gaps in a canopy and back, ground returns can be picked out and a bare-earth surface built under a forest."
    },
    {
      prompt: "Bare-earth model, or a surface off the buildings?",
      detail: "You need a surface that includes rooftops, for a line-of-sight study in a downtown core.",
      options: ["The bare-earth terrain model", "A surface off the buildings"],
      answer: "A surface off the buildings",
      explanation: "A bare-earth model is classified to ground returns only, with vegetation and structures removed — so it discards exactly the rooftops the study needs. The city surface in this lecture is extracted from the building returns in an airborne point cloud, and it is the input to line-of-sight, solar potential, view analysis and flood modeling in an urban core."
    },
    {
      prompt: "The same terrain, symbolized identically, at 30 meter cells and at 100 meter cells. What did the coarser grid cost you?",
      options: [
        "Nothing — the elevation numbers are unchanged",
        "The coordinate system, which has to be redefined",
        "The small drainages, and slope at parcel scale",
        "The vertical datum the elevations refer to"
      ],
      answer: "The small drainages, and slope at parcel scale",
      explanation: "Cell size sets the finest thing the grid can resolve. At 100 meters the small drainages vanish and a parcel spans only a handful of cells, so a slope computed there describes a footprint far bigger than the parcel. Every surface derived from a DEM inherits that choice, which is why cell size is something you pick for a job rather than accept."
    }
  ],
  perfectNote: "Perfect. You can say where a surface came from, how it was measured, and what you gave up choosing it.",
  goodNote: "Solid. Read the explanations on the ones you missed — the returns question and the resolution question are the two that bite in the lab.",
  tryAgainNote: "Worth another pass before you download anything. The short version: a DEM is a model of a surface, LiDAR times a pulse and the ground echo comes back last, and cell size decides what you will still be able to see."
});
</script>
