  <meta name="description" content="CE 414 in-class quiz: kriging, error rasters, RMSE, and where the error lives.">

<body>
<div class="container" id="quizRoot"></div>
<script src="../lib/quiz.js"></script>
<script>
CE414Quiz.start({
  title: "How Wrong Is the Surface?",
  subtitle: "CE 414 &middot; Week 9 &mdash; Kriging and Interpolation Error<br>" +
            "You rebuilt a DEM from points. For each item, decide what kriging or the error tells you " +
            "<strong>and what it does not</strong>.",
  badge: "Error call",
  deckUrl: "../../slides/week-09/interpolation-explorer.html",
  questions: [
    {
      prompt: "Kriging is described as similar to IDW. Where does it differ?",
      options: [
        "It uses only the nearest sample point",
        "The data's spatial structure sets the weights",
        "It requires the samples to lie on a regular grid"
      ],
      answer: "The data's spatial structure sets the weights",
      explanation: "IDW's weights come from an exponent you choose before you look at the data. Kriging first models how quickly the variable stops being similar as distance grows — that is what the fitted semivariogram model records — and then uses the minimum variance method to set the weights, so the data decide how far influence reaches."
    },
    {
      prompt: "A fitted semivariogram is almost all nugget: the nugget is nearly as large as the sill. What will the kriged surface do?",
      options: [
        "Pass exactly through every sample point",
        "Treat nearby points as barely related, and smooth toward the mean",
        "Turn into the Thiessen surface"
      ],
      answer: "Treat nearby points as barely related, and smooth toward the mean",
      explanation: "The nugget is the semivariance at almost zero distance. If it is nearly the whole sill, the model says even close neighbors are almost unrelated, so kriging gives no point much extra weight and the surface flattens toward the average. It also stops returning the measured values: kriging is exact only when the nugget is zero. The six-methods test in today's deck showed this happening when the variogram was fitted automatically: the dots rose and then fell, the fit settled on a flat line with a range of almost zero, and every cell got the mean."
    },
    {
      prompt: "Your error raster is the true DEM minus the surface. A cell reads +40. What happened there?",
      options: [
        "The surface came out 40 m too low",
        "The surface came out 40 m too high",
        "The true DEM is 40 m in error",
        "Forty sample points fell in that cell"
      ],
      answer: "The surface came out 40 m too low",
      explanation: "Truth minus surface is positive when the truth is bigger, so the surface fell short of the ground by 40 m. Subtract the other way and every sign, and every color on the map, flips, which is why the order is fixed once and kept."
    },
    {
      prompt: "Why are the errors squared before they are averaged in an RMSE?",
      options: [
        "To turn meters into square meters",
        "So cells with no data drop out",
        "So positive and negative errors cannot cancel out",
        "Zonal Statistics cannot average negatives"
      ],
      answer: "So positive and negative errors cannot cancel out",
      explanation: "A surface 40 m too low in one cell and 40 m too high in the next averages to zero error, which says it is perfect. Squaring gets rid of the minus signs, so every miss adds to the total; the square root at the end puts the answer back in meters."
    },
    {
      prompt: "ArcGIS Pro has no single RMSE tool. In what order do you chain the steps?",
      options: [
        "Subtract, take the mean, square it, then take the square root",
        "Subtract, square each cell, take the mean, then take the square root",
        "Subtract, take the square root of each cell, then take the mean"
      ],
      answer: "Subtract, square each cell, take the mean, then take the square root",
      explanation: "Read the formula from the inside out: the error (Raster Calculator, truth minus surface), its square (Raster Calculator again), the mean over the study area (Zonal Statistics as Table, statistic Mean), and the square root (Calculate Field, math.sqrt(!MEAN!)). Taking the mean before squaring lets highs and lows cancel; the root of each cell just gives back the size of each error."
    },
    {
      prompt: "Kriging rebuilt Mount Timpanogos better than Tuesday's methods, yet its surface still lacks the mountain's real ridges and gullies. Why?",
      options: [
        "Its spherical semivariogram was the wrong shape for a mountain",
        "The 150 sample elevations were measured with too much error",
        "Between samples it can only average the points it was given"
      ],
      answer: "Between samples it can only average the points it was given",
      explanation: "No interpolator can fabricate data. Every kriged cell is a weighted average of nearby samples, so a ridge or gully that no sample fell on cannot show up in the surface. A better model will not bring that detail back; more measurements will."
    },
    {
      prompt: "On a baseline error map, where does most of the error live?",
      detail: "Think about the Y Mountain error maps: a flat valley floor and a steep mountain front.",
      options: [
        "On the flat valley floor, far from the mountain",
        "Where the ground changes faster than the samples are spaced",
        "Spread evenly over the whole map"
      ],
      answer: "Where the ground changes faster than the samples are spaced",
      explanation: "On flat ground any nearby sample is close to the truth, so every method is within a few meters there. The error piles up on the mountain front, where the elevation changes a lot between samples. That is also where Lab 8 asks you to find your best method's worst cell."
    },
    {
      prompt: "An image model filled in the same 150 samples with a believable mountain range. At the 60 hold-out points its RMSE was 367 m; fitted kriging's was 73 m. What does that show?",
      options: [
        "Realistic is not accurate: only measurements place the real ridges",
        "The 60 hold-out points must have been measured in error",
        "A hold-out test is unfair to a surface an AI generates"
      ],
      answer: "Realistic is not accurate: only measurements place the real ridges",
      explanation: "The model drew ridges and canyons that look like real terrain, but not this mountain's, and it scored no better than putting the samples' average in every cell (372 m). Hold-out points are how you tell a believable surface from an accurate one, and they will judge the next interpolator too, whether it is fitted or trained."
    }
  ],
  perfectNote:  "All of them. You are ready for Lab 8's kriging runs, its error maps and its sensitivity questions.",
  goodNote:     "Good. Reread the explanations you missed before you start Lab 8 Step 6.",
  tryAgainNote: "Kriging lets the semivariogram set the weights, error is truth minus surface, RMSE squares it so highs and lows cannot cancel, and the error lives where the ground changes faster than the samples. Look at those slides again."
});
</script>
</body>
</html>
