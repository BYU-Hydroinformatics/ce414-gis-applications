  <title>CE 414 — How Wrong Is the Surface?</title>
  <link rel="icon" type="image/png" href="../../assets/favicon.png">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="CE 414 in-class quiz: kriging, error rasters, RMSE, and where the error lives.">

</head>
<body>
<div class="container" id="quizRoot"></div>
<script src="../lib/quiz.js"></script>
<script>
CE414Quiz.start({
  title: "How Wrong Is the Surface?",
  subtitle: "CE 414 &middot; Week 9 &mdash; Kriging and Interpolation Error<br>" +
            "You rebuilt a DEM from points. For each item, decide what kriging or the error tells you " +
            "<strong>and what it does not</strong>.",
  badge: "Error call",
  deckUrl: "../../slides/week-09/interpolation-explorer.html",
  questions: [
    {
      prompt: "Kriging is described as similar to IDW. Where does it differ?",
      options: [
        "It uses only the nearest sample point",
        "The data's spatial structure sets the weights",
        "It requires the samples to lie on a regular grid"
      ],
      answer: "The data's spatial structure sets the weights",
      explanation: "IDW's weights come from an exponent you choose before you look at the data. Kriging first models how quickly the variable stops being similar as distance grows — that is what the fitted semivariogram model records — and then uses the minimum variance method to set the weights, so the data decide how far influence reaches."
    },
    {
      prompt: "A fitted semivariogram is almost all nugget: the nugget is nearly as large as the sill. What will the kriged surface do?",
      options: [
        "Pass exactly through every sample point",
        "Treat nearby points as barely related, and smooth toward the mean",
        "Turn into the Thiessen surface"
      ],
      answer: "Treat nearby points as barely related, and smooth toward the mean",
      explanation: "The nugget is the semivariance at almost zero distance. If it is nearly the whole sill, the model says even close neighbors are almost unrelated, so kriging gives no point much extra weight and the surface flattens toward the average. It also stops returning the measured values: kriging is exact only when the nugget is zero. The six-methods test in today's deck showed this happening when the variogram was fitted automatically: almost all nugget, and a flat surface at the mean."
    },
    {
      prompt: "Your error raster is the true DEM minus the surface. A cell reads +40. What happened there?",
      options: [
        "The surface came out 40 m too low",
        "The surface came out 40 m too high",
        "The true DEM is 40 m in error",
        "Forty sample points fell in that cell"
      ],
      answer: "The surface came out 40 m too low",
      explanation: "Truth minus surface is positive when the truth is bigger, so the surface fell short of the ground by 40 m. Subtract the other way and every sign, and every color on the map, flips, which is why the order is fixed once and kept."
    },
    {
      prompt: "Why are the errors squared before they are averaged in an RMSE?",
      options: [
        "To turn meters into square meters",
        "So cells with no data drop out",
        "So every miss counts, big ones most",
        "Zonal Statistics cannot average negatives"
      ],
      answer: "So every miss counts, big ones most",
      explanation: "Averaged as they are, a surface too high in one place and too low in another can score near zero. Squaring makes every miss positive and weights a 100 m miss far more than a 5 m one; the square root at the end puts the answer back in meters."
    },
    {
      prompt: "Two surfaces have the same RMSE. What could still differ between them?",
      options: [
        "Nothing; same RMSE, same surface",
        "Where the errors are, and which way",
        "Only the cell size of the two surfaces"
      ],
      answer: "Where the errors are, and which way",
      explanation: "An RMSE is one number for a whole map. One surface could be biased high everywhere and the other balanced, or one could have a single huge miss on a cliff band. The error map shows what the number hides."
    },
    {
      prompt: "On a baseline error map, where does most of the error live?",
      detail: "Think about the Y Mountain error maps: a flat valley floor and a steep mountain front.",
      options: [
        "On the flat valley floor, far from the mountain",
        "Where the ground changes faster than the samples are spaced",
        "Spread evenly over the whole map"
      ],
      answer: "Where the ground changes faster than the samples are spaced",
      explanation: "On flat ground any nearby sample is close to the truth, so every method is within a few meters there. The error piles up on the mountain front, where the elevation changes a lot between samples. That is also where Lab 8 asks you to find your best method's worst cell."
    },
    {
      prompt: "Lab 8 also runs kriging with a Gaussian semivariogram model. What does a Gaussian model assume?",
      options: [
        "That neighbors lose their likeness fastest, right at the start",
        "That there is no spatial structure at all",
        "A very smooth surface: flat near zero, so close neighbors are nearly identical"
      ],
      answer: "A very smooth surface: flat near zero, so close neighbors are nearly identical",
      explanation: "The three models share a nugget, sill and range but differ near zero distance, where the nearest samples carry most of the weight. Spherical rises steadily, exponential is steepest at first, and Gaussian starts flat, which assumes a very smooth surface. On rugged ground that assumption can go wrong; Lab 8 asks you to look at where."
    }
  ],
  perfectNote:  "All of them. You are ready for Lab 8's kriging runs, its error maps and its sensitivity questions.",
  goodNote:     "Good. Reread the explanations you missed before you start Lab 8 Step 6.",
  tryAgainNote: "Kriging lets the semivariogram set the weights, error is truth minus surface, RMSE squares it so every miss counts, and the error lives where the ground changes faster than the samples. Look at those slides again."
});
</script>
</body>
</html>
