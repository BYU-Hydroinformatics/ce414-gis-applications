<div class="container" id="quizRoot"></div>
<script src="../lib/quiz.js"></script>
<script>
CE414Quiz.start({
  title: "Light and Bands",
  subtitle: "CE 414 &middot; Week 4 &mdash; Remote Sensing<br>" +
            "Five questions on the <strong>bands</strong> inside a color image, " +
            "<strong>near-infrared</strong>, <strong>false color</strong>, and the <strong>satellites</strong> that take the pictures.",
  badge: "Remote sensing",
  deckUrl: "../../slides/week-04/remote-sensing.html",
  questions: [
    {
      prompt: "You split a color photo into its red, green and blue bands. What does each band hold?",
      badge: "Bands",
      options: [
        "A third of the photo's pixels, chosen at random",
        "The photo's colors, sorted from dark to light",
        "One number per pixel: that color's brightness",
        "A copy of the whole photo, tinted one color"
      ],
      answer: "One number per pixel: that color's brightness",
      explanation: "Every band covers every pixel. It is one sheet of grid paper, holding one number per cell: how much red, or green, or blue light came back from that spot, from 0 to 255. Stack the three sheets and each pixel has three numbers, which is its hex color."
    },
    {
      prompt: "Healthy vegetation is bright in a reflected near-infrared image. Why?",
      badge: "Reflected or emitted",
      options: [
        "The leaves are warmer than the bare ground surrounding them",
        "Chlorophyll emits near-infrared during photosynthesis",
        "The sensor brightens vegetation so that it stands out",
        "Leaf structure reflects near-infrared back to the sensor"
      ],
      answer: "Leaf structure reflects near-infrared back to the sensor",
      explanation: "Reflected near-infrared is sunlight bouncing off a surface, exactly like visible light — it is not heat. Thermal infrared, farther along the spectrum, is energy a surface emits because of its own temperature. Plants are bright in the near-infrared because leaves reflect it, not because they are warm."
    },
    {
      prompt: "You load each band as its own layer in ArcGIS Pro, turn off the blue and red band layers, and symbolize the near-infrared band with a rainbow ramp from purple (0) to red (255). What have you made?",
      badge: "False color",
      options: [
        "A false-color image: the colors are a display choice",
        "A natural-color image, since it spans purple to red",
        "A thermal image, since near-infrared measures heat",
        "Nothing yet: false color needs all three bands on"
      ],
      answer: "A false-color image: the colors are a display choice",
      explanation: "Any color on any band is false color. The near-infrared band is still just one number per pixel; the rainbow ramp only decides how each number is drawn, so 0 is purple and 255 is red. It needs no second or third band, and it is not heat: near-infrared is reflected sunlight. Bright leaves will simply land at the red end of the ramp."
    },
    {
      prompt: "What sets a weather satellite like GOES apart from Landsat?",
      badge: "Satellites",
      options: [
        "It flies lower, so its pixels are much sharper",
        "It stays over one spot, imaging it every few minutes",
        "It carries hundreds of narrow, contiguous bands",
        "It sends its own radar pulse, so it sees at night"
      ],
      answer: "It stays over one spot, imaging it every few minutes",
      explanation: "GOES is geostationary: far out over the equator, it circles once a day, so it hangs over the same part of the Earth and can image it again and again. Landsat flies much lower, pole to pole, so its pixels are sharper, but it covers the planet one strip at a time and comes back only every few days."
    },
    {
      prompt: "Why doesn't one satellite do everything?",
      badge: "Satellites",
      options: [
        "Each satellite can carry only one band at a time",
        "Only one space agency is allowed to launch them",
        "Sharper pixels cost coverage and revisit time",
        "Clouds block every sensor, whatever its band"
      ],
      answer: "Sharper pixels cost coverage and revisit time",
      explanation: "Every satellite trades detail against coverage and revisit. A sub-meter commercial image shows one torn roof but covers a few blocks; a weather satellite sees the whole storm every few minutes with pixels kilometers wide; Landsat sits in between. Satellites carry many bands, many agencies launch them, and radar sees through cloud."
    }
  ],
  perfectNote: "A perfect score — you can pull an image apart into bands, and say what any display of those bands means.",
  goodNote: "Solid. Read the explanations for the ones you missed; the bands question is the one to get solid before Quiz 4.",
  tryAgainNote: "Worth another pass. The short version: a band is one grid of numbers from 0 to 255, one brightness per pixel; any colors you put on a band make a false-color display; and sharper pixels cost a satellite coverage and revisit time."
});
</script>
</body>
</html>
