CE414Quiz.start({
  title: "Projections and Datums",
  subtitle: "CE 414 &middot; Week 11 &mdash; Coordinate Systems and Projections<br>" +
            "Five decisions about the frame your data sits in: what the numbers " +
            "<strong>measure</strong>, what the map <strong>gives up</strong>, and what the " +
            "coordinates are <strong>measured from</strong>.",
  badge: "Coordinate question",
  deckUrl: "../../slides/week-11/coordinate-systems-projections.html",
  questions: [
    {
      badge: "Units",
      prompt: "You subtract the latitude and longitude of two points and get a number. What is that number?",
      detail: "Both points are stored in degrees of latitude and longitude, exactly as they came off a web map.",
      options: ["A distance in meters", "A distance in kilometers", "A distance, but in unknown units", "An angle, in degrees"],
      answer: "An angle, in degrees",
      explanation: "Latitude and longitude are angles, so the difference between two of them is an angle too. It is not a length: a degree of longitude covers a different ground distance than a degree of latitude, and neither one is constant as you move over the Earth. Express the same two points in a projected system such as UTM and the coordinates are linear, so subtracting them gives meters."
    },
    {
      badge: "Distortion",
      prompt: "On a standard Mercator world map, Greenland looks about the size of Africa. On a globe it is closer to the size of Mexico. What is the Mercator sacrificing?",
      options: ["Area", "Shape and angles", "Direction", "Nothing — the globe is the distorted one"],
      answer: "Area",
      explanation: "Mercator is conformal: it holds shape and angles locally, and it pays for that in area, which inflates toward the poles as the parallels spread apart. That is the general rule this deck is built on — a projection can preserve area, or shape, or distance, or direction, but never all four, so the question is never “which projection is right” but “which distortion can I afford here.”"
    },
    {
      badge: "Choosing a projection",
      prompt: "You are mapping a state whose extent is long east-west, like Tennessee. Which minimizes distortion across it?",
      options: ["Lambert Conformal Conic", "Universal Transverse Mercator"],
      answer: "Lambert Conformal Conic",
      explanation: "A cone contacts the globe along a parallel, so a conic projection's band of least distortion runs east-west along the long axis of the state. A UTM zone's runs north-south along the zone's central meridian, which leaves the east and west ends of the state far off the line. Match the shape of the low-distortion band to the shape of the study area."
    },
    {
      badge: "Shape of the Earth",
      prompt: "Which surface is defined by the Earth's gravity rather than by a formula?",
      detail: "Sea level varies from place to place because gravity varies, and gravity varies because the density of the Earth varies.",
      options: ["The ellipsoid", "The topographic surface", "The geoid"],
      answer: "The geoid",
      explanation: "The geoid is an equigravitational surface — where the sea would settle everywhere if water could flow freely — so it is lumpy in a way no equation predicts. The ellipsoid is the smooth mathematical best fit to that shape, and the topography is the ground you actually walk on. Keeping the three apart is what lets you say what a given elevation is measured from."
    },
    {
      badge: "Datum",
      prompt: "A classmate says “this layer is in NAD 83, so it is projected.” What is wrong with that?",
      detail: "The layer is going to be combined with a second dataset that came from another agency.",
      options: [
        "Nothing — NAD 83 is a projection",
        "NAD 83 is a datum, a separate decision from the projection",
        "NAD 83 is a unit of measure, not a coordinate system",
        "NAD 83 is a UTM zone"
      ],
      answer: "NAD 83 is a datum, a separate decision from the projection",
      explanation: "A datum fixes the reference shape used for the Earth and how that shape is tied to the ground, so it answers what the coordinates are measured from; a projection answers how the curved surface is flattened onto a sheet. They are independent choices, and the datum is the one that bites when you merge data: find out which datum each dataset is in, choose the transformation deliberately rather than taking whatever the software defaults to, and record it in your metadata alongside the coordinate system."
    }
  ],
  perfectNote: "A perfect score — you can say what your coordinates measure, what your map gives up, and what both are measured from.",
  goodNote: "Solid. Read the explanations on the ones you missed; the distortion items are the ones that split a room.",
  tryAgainNote: "Worth another pass. The short version: degrees are angles and meters are lengths; every projection sacrifices something, so you choose which; and the datum is a separate decision from the projection."
});
</script>
