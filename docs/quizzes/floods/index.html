  <title>CE 414 — How Big, How High?</title>
  <link rel="icon" type="image/png" href="../../assets/favicon.png">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="CE 414 in-class quiz: return periods, rating curves, depth, and when a bathtub flood model is the right one.">
  <link rel="stylesheet" href="../lib/quiz.css">
</head>
<body>
<div class="container" id="quizRoot"></div>
<script src="../lib/quiz.js"></script>
<script>
CE414Quiz.start({
  title: "How Big, How High?",
  subtitle: "CE 414 &middot; Week 8 &mdash; Flood Mapping, Part B<br>" +
            "From a flood flow to a depth, and how good the map is. For each item, decide what the number " +
            "<strong>actually means</strong>.",
  badge: "Flood call",
  deckUrl: "../../slides/week-08/hand.html",
  questions: [
    {
      prompt: "What does \"the 100-year flood\" mean?",
      options: [
        "A 1% chance of being exceeded each year",
        "A flood that happens once every hundred years",
        "The largest flow measured in the last century",
        "A flood that cannot recur for another century"
      ],
      answer: "A 1% chance of being exceeded each year",
      explanation: "It is a probability that resets every year, which is why FEMA writes \"1% annual chance\". Two such floods can come in back-to-back years; a 100-year record need not contain one."
    },
    {
      prompt: "Lab 7's Flood Loop iterates over H_CM, each depth in whole centimeters (153), not H_M in meters (1.53). Why?",
      options: [
        "Iterate Field Values can only read whole numbers",
        "Each pass names its output flood_%Value%, and flood_1.53 is not a legal geodatabase name",
        "HAND is stored in centimeters",
        "Raster Calculator cannot handle decimals"
      ],
      answer: "Each pass names its output flood_%Value%, and flood_1.53 is not a legal geodatabase name",
      explanation: "%Value% goes into the output name as well as the expression, and a geodatabase raster name cannot contain a period: flood_153 works, flood_1.53 does not. The expression divides it back, Con(\"HAND\" <= %Value% / 100, 1), so the flood is still measured in meters."
    },
    {
      prompt: "FEMA's 1% flow for the Provo River is above the top row of the gage's rating curve. What does that mean for its water level?",
      options: [
        "Its level is extrapolated",
        "The flood cannot be mapped at all",
        "The gage has failed and must be replaced",
        "The flow must be reduced to the top row"
      ],
      answer: "Its level is extrapolated",
      explanation: "A rating is built from field measurements, and the largest floods are the hardest to measure. Above the last row, the level comes from extending the curve: usable, but the least certain part of the answer."
    },
    {
      prompt: "Why does Lab 7 flood the land by depth above the river instead of by water elevation?",
      options: [
        "Depth is always measured in feet",
        "HAND is also a height above the river",
        "The DEM has no vertical datum to use"
      ],
      answer: "HAND is also a height above the river",
      explanation: "Depth is gage height minus the zero-flow offset, a height above the river, which is exactly what HAND measures for every cell. The gage datum never enters h; you need it only to turn a gage height into an elevation, as a bathtub or FEMA's water surface does."
    },
    {
      prompt: "When is a bathtub model (one flat water elevation) the right flood model?",
      options: [
        "A steep mountain river",
        "Any river, if the DEM is fine enough",
        "A river just below a dam",
        "A lake with a level surface"
      ],
      answer: "A lake with a level surface",
      explanation: "A lake's surface really is flat, which is why Lab 6's shorelines were bathtubs. A river's surface slopes downhill, so one flat elevation drowns the low ground near its mouth and never reaches the river upstream."
    },
    {
      prompt: "Your flood map and FEMA's overlap well, but yours also floods a lot of land FEMA calls dry. Which score shows that?",
      options: [
        "A high false-alarm ratio",
        "A high hit rate",
        "A low number of misses"
      ],
      answer: "A high false-alarm ratio",
      explanation: "The false-alarm ratio is the share of your flooded area that FEMA calls dry. The hit rate only asks how much of FEMA's floodplain you caught, so a map that floods everything scores a perfect hit rate; CSI counts both errors at once."
    }
  ],
  perfectNote:  "All six. On to Lab 7.",
  goodNote:     "Good. Reread the explanations you missed before Lab 7.",
  tryAgainNote: "A 100-year flood is a 1% chance every year, a rating turns flow into a water level, a bathtub only suits a flat water surface, and the false-alarm ratio is the share of your flood the other map calls dry. Look at those slides again."
});
</script>
</body>
</html>
