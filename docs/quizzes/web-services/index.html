<body>
<div class="container" id="quizRoot"></div>
<script src="../lib/quiz.js"></script>
<script>
CE414Quiz.start({
  title: "What Comes Back?",
  subtitle: "CE 414 &middot; Week 9 &mdash; Overview of OGC Web Services<br>" +
            "Five decisions about what a service actually hands you &mdash; " +
            "a <strong>picture</strong>, the <strong>features</strong>, the <strong>values</strong>, " +
            "or only a pointer to somebody else&rsquo;s server.",
  badge: "OGC web services",
  deckUrl: "../../slides/week-09/ogc-web-services.html",
  questions: [
    {
      prompt: "“It is closed-source software, so it cannot be OGC compliant.”",
      detail: "A company ships a proprietary map server that implements the Web Map Service and Web Feature Service specifications exactly as written.",
      badge: "Open standard",
      options: [
        "Right — an open standard means the implementation has to be open too",
        "Wrong — a standard is a document, not a piece of software"
      ],
      answer: "Wrong — a standard is a document, not a piece of software",
      explanation: "This is the distinction most often collapsed. An OGC standard is a consensus document — freely available, no license fees, vendor neutral — and it is explicitly not open source software. Open source and proprietary products can implement the same standard and interoperate, which is the whole point of writing the interface down."
    },
    {
      prompt: "You need each country's name, population and area so your application can query them and re-symbolize on the fly.",
      badge: "Choosing a service",
      options: [
        "Web Map Service (WMS)",
        "Web Coverage Service (WCS)",
        "Catalog Service for the Web (CSW)",
        "Web Feature Service (WFS)"
      ],
      answer: "Web Feature Service (WFS)",
      explanation: "WFS returns the features themselves — geometry plus attributes, encoded as GML — so the client holds the values and can query them. A WMS would put the same countries on screen as a picture with nothing left to interrogate; WCS serves coverages; CSW serves metadata about where services live."
    },
    {
      prompt: "A Web Map Service returns a map image of a Landsat mosaic for the window you asked for.",
      detail: "What can you legitimately do with what came back?",
      badge: "Map as picture",
      options: [
        "Display it, and ask the server what is at a point on it",
        "Display it, and run map algebra on the pixel values as if they were the Landsat bands",
        "Display it, and select individual features in it to edit their attributes"
      ],
      answer: "Display it, and ask the server what is at a point on it",
      explanation: "A WMS response is a symbolized picture, rendered on the fly from whichever bands you requested. It still supports GetFeatureInfo, because a pixel location on the returned image corresponds to a point in the data on the server — the deck's example comes back with an elevation of 237 meters. But the numbers in the image are display colors, not measurements, and there are no features inside it to select. For the values you would ask a WCS; for editable features, a WFS."
    },
    {
      prompt: "A triangulated irregular network (TIN) of ground elevations",
      detail: "Does it count as a coverage?",
      badge: "Coverages",
      options: [
        "Yes — every position inside the triangulation has a value",
        "No — the geometry is irregular, and a coverage has to be a grid of regular cells",
        "No — elevation is a measurement, and coverages hold classes"
      ],
      answer: "Yes — every position inside the triangulation has a value",
      explanation: "A coverage associates positions within a bounded space with attribute values — a space-varying phenomenon — and nothing in that definition demands square cells. The deck's four examples run from a brightness grid through land cover and multi-spectral imagery to a TIN, which also settles the third option: land cover is categories, brightness is magnitudes, and the coverage does not care which."
    },
    {
      prompt: "What does a catalog service actually serve?",
      badge: "Publish, find, bind",
      options: [
        "A copy of the features held by every server it knows about",
        "Pre-rendered maps of everything in its holdings",
        "Metadata about other data and services, so a client can find them"
      ],
      answer: "Metadata about other data and services, so a client can find them",
      explanation: "A catalog is a service whose data is metadata about other services — the GEOSS registry in the deck is a list of published components, not a copy of their data. It carries the publish and find steps of publish / find / bind: a provider advertises there, a client discovers what it needs, and then binds straight to the provider that holds the data."
    }
  ],
  perfectNote: "A perfect score — you can read a service listing now and know what will land in your hands.",
  goodNote: "Solid. Read the explanations on the ones you missed; the picture-versus-data ones are the ones that bite in practice.",
  tryAgainNote: "Worth another pass. The short version: a map service sends a picture, a feature service sends the features with their attributes, a coverage service sends the values, and a catalog only tells you where to ask."
});
</script>
</body>
</html>
