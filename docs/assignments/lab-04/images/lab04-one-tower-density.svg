<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 475' width='1000' height='475' role='img' aria-label='Density around a single tower for search radii of 10, 20 and 40 kilometers, against the 20 per 10,000 square kilometer threshold'>
<title>What the density threshold means around one tower</title>
<rect width='1000' height='475' fill='white'/>
<text x='20' y='34' font-size='20' font-weight='bold' fill='#002e5d' text-anchor='start' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>What &#39;20 towers per 10,000 km²&#39; means around ONE tower</text>
<text x='20' y='56' font-size='12' font-weight='normal' fill='#5b6770' text-anchor='start' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Kernel Density spreads each tower over a circle of the search radius. The curve is the density that one tower alone contributes, by distance.</text>
