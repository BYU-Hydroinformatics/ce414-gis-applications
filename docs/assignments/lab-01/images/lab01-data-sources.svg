<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 470' width='960' height='470' role='img' aria-label='Six places GIS data comes from, and which four this lab uses'>
<title>Where GIS data comes from</title>
<rect width='960' height='470' rx='14' fill='white' stroke='#e6eaee'/>
<text x='30' y='40' font-size='22' font-weight='700' fill='#002e5d' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Where GIS data comes from</text>
<text x='30' y='62' font-size='13' fill='#555' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Real projects mix several of these. This lab deliberately uses four of them, marked in orange.</text>
<rect x='30' y='85' width='143' height='230' rx='10' fill='#f7f9fb' stroke='#e8862a' stroke-width='2'/>
<path d='M79.5,129 a12,12 0 0 1 6,-22 a16,16 0 0 1 30,4 a10,10 0 0 1 4,18 z' fill='#cfe3f7' stroke='#0062b8' stroke-width='2' stroke-linejoin='round'/><line x1='101.5' y1='121' x2='101.5' y2='143' stroke='#e8862a' stroke-width='3'/><polyline points='94.5,136 101.5,144 108.5,136' fill='none' stroke='#e8862a' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/>
<text x='101.5' y='173' text-anchor='middle' font-size='14' font-weight='700' fill='#002e5d' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Open data</text>
<text x='101.5' y='189' text-anchor='middle' font-size='14' font-weight='700' fill='#002e5d' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>portals</text>
<text x='101.5' y='207' text-anchor='middle' font-size='11.5' fill='#333' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Government agencies</text>
<text x='101.5' y='222' text-anchor='middle' font-size='11.5' fill='#333' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>publishing what they</text>
<text x='101.5' y='237' text-anchor='middle' font-size='11.5' fill='#333' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>maintain: UGRC,</text>
<text x='101.5' y='252' text-anchor='middle' font-size='11.5' fill='#333' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>USGS, the Census</text>
<text x='101.5' y='267' text-anchor='middle' font-size='11.5' fill='#333' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Bureau.</text>
<rect x='33.80000000000001' y='285' width='135.39999999999998' height='20' rx='10' fill='#e8862a'/>
<text x='101.5' y='299' text-anchor='middle' font-size='11' font-weight='700' fill='white' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Counties and tracts</text>
<line x1='101.5' y1='315' x2='101.5' y2='345' stroke='#e8862a' stroke-width='2' stroke-dasharray='none'/>
<rect x='183' y='85' width='143' height='230' rx='10' fill='#f7f9fb' stroke='#e8862a' stroke-width='2'/>
<rect x='236.5' y='111' width='36' height='32' rx='3' fill='#cfe3f7' stroke='#0062b8' stroke-width='2'/><rect x='236.5' y='111' width='36' height='9' fill='#0062b8'/><rect x='249.5' y='111' width='10' height='22' fill='#e8862a'/>
<text x='254.5' y='173' text-anchor='middle' font-size='14' font-weight='700' fill='#002e5d' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Prepared for</text>
<text x='254.5' y='189' text-anchor='middle' font-size='14' font-weight='700' fill='#002e5d' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>you</text>
<text x='254.5' y='207' text-anchor='middle' font-size='11.5' fill='#333' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>An extract someone</text>
<text x='254.5' y='222' text-anchor='middle' font-size='11.5' fill='#333' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>else clipped,</text>
<text x='254.5' y='237' text-anchor='middle' font-size='11.5' fill='#333' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>cleaned or</text>
<text x='254.5' y='252' text-anchor='middle' font-size='11.5' fill='#333' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>repackaged. Check</text>
<text x='254.5' y='267' text-anchor='middle' font-size='11.5' fill='#333' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>what they did to it.</text>
<rect x='206.6' y='285' width='95.8' height='20' rx='10' fill='#e8862a'/>
<text x='254.5' y='299' text-anchor='middle' font-size='11' font-weight='700' fill='white' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Roads extract</text>
<line x1='254.5' y1='315' x2='254.5' y2='345' stroke='#e8862a' stroke-width='2' stroke-dasharray='none'/>
<rect x='336' y='85' width='143' height='230' rx='10' fill='#f7f9fb' stroke='#e8862a' stroke-width='2'/>
<circle cx='399.5' cy='135' r='5' fill='#e8862a'/><path d='M403.5,131 l22,-22 l7,7 l-22,22 l-9,2 z' fill='#cfe3f7' stroke='#0062b8' stroke-width='2' stroke-linejoin='round'/>
<text x='407.5' y='173' text-anchor='middle' font-size='14' font-weight='700' fill='#002e5d' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>You create it</text>
<text x='407.5' y='207' text-anchor='middle' font-size='11.5' fill='#333' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Digitize from</text>
<text x='407.5' y='222' text-anchor='middle' font-size='11.5' fill='#333' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>imagery, survey it,</text>
<text x='407.5' y='237' text-anchor='middle' font-size='11.5' fill='#333' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>collect it with GPS,</text>
<text x='407.5' y='252' text-anchor='middle' font-size='11.5' fill='#333' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>or type it in from a</text>
<text x='407.5' y='267' text-anchor='middle' font-size='11.5' fill='#333' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>list.</text>
<rect x='356.3' y='285' width='102.39999999999999' height='20' rx='10' fill='#e8862a'/>
<text x='407.5' y='299' text-anchor='middle' font-size='11' font-weight='700' fill='white' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Walmart points</text>
<line x1='407.5' y1='315' x2='407.5' y2='345' stroke='#e8862a' stroke-width='2' stroke-dasharray='none'/>
<rect x='489' y='85' width='143' height='230' rx='10' fill='#f7f9fb' stroke='#e8862a' stroke-width='2'/>
<circle cx='560.5' cy='137' r='4' fill='#e8862a'/><path d='M548.5,127 a17,17 0 0 1 24,0' fill='none' stroke='#0062b8' stroke-width='2.5' stroke-linecap='round'/><path d='M538.5,118 a31,31 0 0 1 44,0' fill='none' stroke='#0062b8' stroke-width='2.5' stroke-linecap='round'/>
<text x='560.5' y='173' text-anchor='middle' font-size='14' font-weight='700' fill='#002e5d' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Live web</text>
<text x='560.5' y='189' text-anchor='middle' font-size='14' font-weight='700' fill='#002e5d' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>services</text>
<text x='560.5' y='207' text-anchor='middle' font-size='11.5' fill='#333' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Streamed from a</text>
<text x='560.5' y='222' text-anchor='middle' font-size='11.5' fill='#333' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>server every time</text>
<text x='560.5' y='237' text-anchor='middle' font-size='11.5' fill='#333' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>you pan. Never on</text>
<text x='560.5' y='252' text-anchor='middle' font-size='11.5' fill='#333' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>your disk; not yours</text>
<text x='560.5' y='267' text-anchor='middle' font-size='11.5' fill='#333' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>to edit.</text>
<rect x='532.4' y='285' width='56.199999999999996' height='20' rx='10' fill='#e8862a'/>
<text x='560.5' y='299' text-anchor='middle' font-size='11' font-weight='700' fill='white' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Basemap</text>
<line x1='560.5' y1='315' x2='560.5' y2='345' stroke='#e8862a' stroke-width='2' stroke-dasharray='none'/>
<rect x='642' y='85' width='143' height='230' rx='10' fill='#f7f9fb' stroke='#e6eaee' stroke-width='1'/>
<rect x='706.5' y='118' width='14' height='14' fill='#cfe3f7' stroke='#0062b8' stroke-width='2' transform='rotate(45 713.5 125)'/><rect x='683.5' y='120' width='16' height='10' fill='#0062b8' transform='rotate(45 713.5 125)'/><rect x='727.5' y='120' width='16' height='10' fill='#0062b8' transform='rotate(45 713.5 125)'/><path d='M707.5,147 a12,12 0 0 1 12,0' fill='none' stroke='#e8862a' stroke-width='2'/>
<text x='713.5' y='173' text-anchor='middle' font-size='14' font-weight='700' fill='#002e5d' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Remote sensing</text>
<text x='713.5' y='207' text-anchor='middle' font-size='11.5' fill='#333' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Satellite, aerial</text>
<text x='713.5' y='222' text-anchor='middle' font-size='11.5' fill='#333' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>and drone imagery;</text>
<text x='713.5' y='237' text-anchor='middle' font-size='11.5' fill='#333' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>elevation from lidar</text>
<text x='713.5' y='252' text-anchor='middle' font-size='11.5' fill='#333' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>and radar.</text>
<rect x='675.5' y='285' width='76.0' height='20' rx='10' fill='#e6eaee'/>
<text x='713.5' y='299' text-anchor='middle' font-size='11' font-weight='700' fill='#555' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Later labs</text>
<line x1='713.5' y1='315' x2='713.5' y2='345' stroke='#9aa5b1' stroke-width='1' stroke-dasharray='4 3'/>
<rect x='795' y='85' width='143' height='230' rx='10' fill='#f7f9fb' stroke='#e6eaee' stroke-width='1'/>
<path d='M848.5,111 h20 l16,16 l-20,20 l-16,-16 z' fill='#cfe3f7' stroke='#0062b8' stroke-width='2' stroke-linejoin='round'/><circle cx='856.5' cy='119' r='3' fill='#0062b8'/><text x='869.5' y='136' font-size='14' font-weight='700' fill='#e8862a' text-anchor='middle' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>$</text>
<text x='866.5' y='173' text-anchor='middle' font-size='14' font-weight='700' fill='#002e5d' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Commercial and</text>
<text x='866.5' y='189' text-anchor='middle' font-size='14' font-weight='700' fill='#002e5d' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>licensed</text>
<text x='866.5' y='207' text-anchor='middle' font-size='11.5' fill='#333' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Vendor datasets,</text>
<text x='866.5' y='222' text-anchor='middle' font-size='11.5' fill='#333' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>parcels, business</text>
<text x='866.5' y='237' text-anchor='middle' font-size='11.5' fill='#333' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>data. Often the</text>
<text x='866.5' y='252' text-anchor='middle' font-size='11.5' fill='#333' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>best, rarely free.</text>
<rect x='812.0' y='285' width='109.0' height='20' rx='10' fill='#e6eaee'/>
<text x='866.5' y='299' text-anchor='middle' font-size='11' font-weight='700' fill='#555' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Not in this lab</text>
<line x1='866.5' y1='315' x2='866.5' y2='345' stroke='#9aa5b1' stroke-width='1' stroke-dasharray='4 3'/>
<rect x='30' y='345' width='900' height='95' rx='10' fill='#002e5d'/>
<text x='54' y='381' font-size='17' font-weight='700' fill='white' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Your project geodatabase</text>
<text x='54' y='405' font-size='12.5' fill='#cfe3f7' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Whatever the source, every layer ends up here: in one coordinate system, with a note of where it came from,</text>
<text x='54' y='423' font-size='12.5' fill='#cfe3f7' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>when you got it, and what license lets you use it. Your report has to be able to say all three for every layer.</text>
</svg>