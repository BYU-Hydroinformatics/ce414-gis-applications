<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 580' width='1000' height='580' role='img' aria-label='The six metadata questions applied to a Landsat scene, each answered from the MTL file'>
<title>The six metadata questions, answered from the Landsat MTL file</title>
<rect width='1000' height='580' fill='white'/>
<text x='20' y='34' font-size='20' font-weight='bold' fill='#0b2a4a' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>Reading a Landsat scene&#x27;s metadata: the MTL file answers the six questions</text>
<text x='20' y='56' font-size='12' font-weight='normal' fill='#5b6770' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>Every value below is copied from LC08_L2SP_038032_20250712_20250725_02_T1_MTL.txt, which ships in the Utah County extract.</text>
<rect x='20' y='75' width='310' height='215' rx='8' fill='#eef2f6' stroke='#c9d2dc'/>
<rect x='20' y='75' width='310' height='34' rx='8' fill='#0b2a4a'/>
<text x='32' y='98' font-size='15' font-weight='bold' fill='white' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>WHAT</text>
<text x='102' y='98' font-size='11' font-weight='normal' fill='white' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>What do the data represent?</text>
<text x='32' y='133' font-size='11' font-weight='normal' fill='#1c2733' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>Landsat 8, OLI/TIRS sensor. Collection 2, Level-2 surface</text><text x='32' y='150' font-size='11' font-weight='normal' fill='#1c2733' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>reflectance (L2SP), Tier 1 (PROCESSING_LEVEL).</text><text x='32' y='167' font-size='11' font-weight='normal' fill='#1c2733' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>Band 4 = red, 0.64-0.67 um. Band 5 = NIR, 0.85-0.88 um.</text><text x='32' y='184' font-size='11' font-weight='normal' fill='#1c2733' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>Stored as integers. To get reflectance:</text><text x='32' y='201' font-size='11' font-weight='normal' fill='#1c2733' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>   DN x 0.0000275 - 0.2</text><text x='32' y='218' font-size='11' font-weight='normal' fill='#1c2733' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>(REFLECTANCE_MULT_BAND_n, REFLECTANCE_ADD_BAND_n).</text>
<rect x='345' y='75' width='310' height='215' rx='8' fill='#eef2f6' stroke='#c9d2dc'/>
<rect x='345' y='75' width='310' height='34' rx='8' fill='#0b2a4a'/>
<text x='357' y='98' font-size='15' font-weight='bold' fill='white' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>WHERE</text>
<text x='427' y='98' font-size='11' font-weight='normal' fill='white' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>Where, and in what coordinate system?</text>
<text x='357' y='133' font-size='11' font-weight='normal' fill='#1c2733' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>WRS-2 path 38, row 32 (WRS_PATH, WRS_ROW).</text><text x='357' y='150' font-size='11' font-weight='normal' fill='#1c2733' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>UTM zone 12, WGS 84 (MAP_PROJECTION, UTM_ZONE).</text><text x='357' y='167' font-size='11' font-weight='normal' fill='#1c2733' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>30 m cells (GRID_CELL_SIZE_REFLECTIVE).</text><text x='357' y='184' font-size='11' font-weight='normal' fill='#1c2733' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>Our extract is clipped to Utah County; the full</text><text x='357' y='201' font-size='11' font-weight='normal' fill='#1c2733' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>scene is about 185 km on a side.</text>
<rect x='670' y='75' width='310' height='215' rx='8' fill='#eef2f6' stroke='#c9d2dc'/>
<rect x='670' y='75' width='310' height='34' rx='8' fill='#0b2a4a'/>
<text x='682' y='98' font-size='15' font-weight='bold' fill='white' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>WHEN</text>
<text x='752' y='98' font-size='11' font-weight='normal' fill='white' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>When were the data collected?</text>
<text x='682' y='133' font-size='11' font-weight='normal' fill='#1c2733' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>DATE_ACQUIRED = 2025-07-12</text><text x='682' y='150' font-size='11' font-weight='normal' fill='#1c2733' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>SCENE_CENTER_TIME = 18:08 UTC (12:08 pm local).</text><text x='682' y='167' font-size='11' font-weight='normal' fill='#1c2733' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>Mid-July: irrigated crops at full canopy, everything</text><text x='682' y='184' font-size='11' font-weight='normal' fill='#1c2733' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>unwatered has cured. SUN_ELEVATION = 64 degrees, so</text><text x='682' y='201' font-size='11' font-weight='normal' fill='#1c2733' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>shadows are short. Product generated 2025-07-25.</text><text x='682' y='218' font-size='11' font-weight='normal' fill='#1c2733' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>A May or October scene tells a different story.</text>
<rect x='20' y='305' width='310' height='215' rx='8' fill='#eef2f6' stroke='#c9d2dc'/>
<rect x='20' y='305' width='310' height='34' rx='8' fill='#0b2a4a'/>
<text x='32' y='328' font-size='15' font-weight='bold' fill='white' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>WHY</text>
<text x='102' y='328' font-size='11' font-weight='normal' fill='white' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>Why were they created?</text>
<text x='32' y='363' font-size='11' font-weight='normal' fill='#1c2733' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>The USGS archive exists for long-term land monitoring,</text><text x='32' y='380' font-size='11' font-weight='normal' fill='#1c2733' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>not for your question. Nothing in the file says</text><text x='32' y='397' font-size='11' font-weight='normal' fill='#1c2733' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>&#x27;irrigation&#x27;. Whether a July NDVI answers an irrigation</text><text x='32' y='414' font-size='11' font-weight='normal' fill='#1c2733' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>question is a judgement you make and defend, not a</text><text x='32' y='431' font-size='11' font-weight='normal' fill='#1c2733' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>property of the data.</text>
<rect x='345' y='305' width='310' height='215' rx='8' fill='#eef2f6' stroke='#c9d2dc'/>
<rect x='345' y='305' width='310' height='34' rx='8' fill='#0b2a4a'/>
<text x='357' y='328' font-size='15' font-weight='bold' fill='white' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>HOW</text>
<text x='427' y='328' font-size='11' font-weight='normal' fill='white' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>How were they collected and processed?</text>
<text x='357' y='363' font-size='11' font-weight='normal' fill='#1c2733' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>Measured by the OLI; corrected to surface reflectance</text><text x='357' y='380' font-size='11' font-weight='normal' fill='#1c2733' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>by the USGS (Collection 2 Level-2). CLOUD_COVER = 0.02 %.</text><text x='357' y='397' font-size='11' font-weight='normal' fill='#1c2733' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>Then by us: clipped to the county, scale factor applied,</text><text x='357' y='414' font-size='11' font-weight='normal' fill='#1c2733' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>small negatives floored at 0, stored as reflectance</text><text x='357' y='431' font-size='11' font-weight='normal' fill='#1c2733' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>x 10,000. READ-ME-FIRST.txt says exactly what was</text><text x='357' y='448' font-size='11' font-weight='normal' fill='#1c2733' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>and was not done.</text>
<rect x='670' y='305' width='310' height='215' rx='8' fill='#eef2f6' stroke='#c9d2dc'/>
<rect x='670' y='305' width='310' height='34' rx='8' fill='#0b2a4a'/>
<text x='682' y='328' font-size='15' font-weight='bold' fill='white' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>WHO</text>
<text x='752' y='328' font-size='11' font-weight='normal' fill='white' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>Who maintains them, and may you use them?</text>
<text x='682' y='363' font-size='11' font-weight='normal' fill='#1c2733' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>U.S. Geological Survey, EROS Center. Public domain:</text><text x='682' y='380' font-size='11' font-weight='normal' fill='#1c2733' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>no restrictions, but credit them. ORIGIN = &#x27;Image</text><text x='682' y='397' font-size='11' font-weight='normal' fill='#1c2733' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>courtesy of the U.S. Geological Survey&#x27;.</text><text x='682' y='414' font-size='11' font-weight='normal' fill='#1c2733' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>LANDSAT_PRODUCT_ID =</text><text x='682' y='431' font-size='11' font-weight='normal' fill='#1c2733' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>LC08_L2SP_038032_20250712_20250725_02_T1 identifies</text><text x='682' y='448' font-size='11' font-weight='normal' fill='#1c2733' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>this exact scene forever. Put it in your report.</text>
<rect x='20' y='525' width='960' height='40' rx='8' fill='#d9741c'/>
<text x='32' y='550' font-size='12.5' font-weight='bold' fill='white' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif'>For your report, copy these three MTL values: DATE_ACQUIRED, CLOUD_COVER, and REFLECTANCE_ADD_BAND_4 - and say what each one means for your result.</text>
</svg>