<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Helvetica,Arial,sans-serif"><rect width="760" height="400" fill="#ffffff"/><polygon points="40,360 40,130 250,175 330,270 560,300 720,318 720,360" fill="#d9c7a6"/><polyline points="40,130 250,175 330,270 560,300 720,318" fill="none" stroke="#8a6a4f" stroke-width="3"/><polyline points="40,84 250,129 330,224 560,254 720,272" fill="none" stroke="#0062b8" stroke-width="3" stroke-dasharray="10 6"/><polyline points="40,80 250,127 290,200 330,248 400,235 520,221 603,228 626,271 720,274" fill="none" stroke="#2e7d32" stroke-width="3.5"/><rect x="586" y="214" width="58" height="10" fill="#4a5568"/><rect x="609" y="224" width="12" height="84" fill="#4a5568"/><text x="60" y="40" font-size="17" font-weight="700" fill="#0062b8">HAND: the same depth h above the river everywhere</text><text x="60" y="62" font-size="17" font-weight="700" fill="#2e7d32">Hydraulic model: the water surface the flow actually makes</text><text x="300" y="318" font-size="15" fill="#22262e" text-anchor="middle">steep reach:</text><text x="300" y="336" font-size="15" fill="#22262e" text-anchor="middle">shallower, faster</text><text x="615" y="176" font-size="15" fill="#22262e" text-anchor="middle">bridge:</text><text x="615" y="194" font-size="15" fill="#22262e" text-anchor="middle">water backs up</text><text x="70" y="168" font-size="15" fill="#8a6a4f">riverbed</text><text x="40" y="386" font-size="14" fill="#4a5568">upstream</text><text x="720" y="386" font-size="14" fill="#4a5568" text-anchor="end">downstream</text><text x="380" y="386" font-size="14" fill="#4a5568" text-anchor="middle">Diagram, not to scale</text></svg>