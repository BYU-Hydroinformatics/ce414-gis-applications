<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">
  <title>From a DEM to a flood map: the Lab 5 chain plus Flow Distance and one threshold</title>
  <rect width="900" height="300" fill="#ffffff"/>
  <defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker></defs>
  <g fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2">
    <rect x="10" y="40" width="110" height="56" rx="8"/>
    <rect x="160" y="40" width="110" height="56" rx="8"/>
    <rect x="310" y="40" width="130" height="56" rx="8"/>
    <rect x="480" y="40" width="150" height="56" rx="8"/>
  </g>
  <g fill="#fffaf0" stroke="#c05621" stroke-width="2">
    <rect x="670" y="40" width="210" height="56" rx="8"/>
    <rect x="670" y="180" width="210" height="56" rx="8"/>
  </g>
  <rect x="440" y="180" width="190" height="56" rx="8" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/>
  <g text-anchor="middle" fill="#1a202c">
    <text x="65" y="73">Fill</text>
    <text x="215" y="73">Flow Direction</text>
    <text x="375" y="66">Flow</text><text x="375" y="84">Accumulation</text>
    <text x="555" y="66">Con (streams)</text><text x="555" y="84">in river corridor</text>
    <text x="775" y="66" font-weight="600">Flow Distance</text><text x="775" y="84">VERTICAL → HAND</text>
    <text x="775" y="206" font-weight="600">Con (HAND ≤ h)</text><text x="775" y="224">→ flooded area</text>
    <text x="535" y="206">stage table: flow</text><text x="535" y="224">→ gage height → h</text>
  </g>
  <g stroke="#4a5568" stroke-width="2" marker-end="url(#m)">
    <line x1="120" y1="68" x2="158" y2="68"/><line x1="270" y1="68" x2="308" y2="68"/>
    <line x1="440" y1="68" x2="478" y2="68"/><line x1="630" y1="68" x2="668" y2="68"/>
    <line x1="775" y1="96" x2="775" y2="178"/><line x1="630" y1="208" x2="668" y2="208"/>
  </g>
  <text x="10" y="24" fill="#2b6cb0" font-weight="600">Lab 5's chain</text>
  <text x="670" y="24" fill="#c05621" font-weight="600">new in Lab 7</text>
  <text x="10" y="280" fill="#4a5568">Flow Direction also feeds Flow Distance: HAND is measured down the path the water takes.</text>
</svg>
