<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16">
  <title>Gage datum, gage height and depth at a stream gage</title>
  <rect width="640" height="420" fill="#ffffff"/>
  <!-- channel -->
  <path d="M20,120 L170,120 L230,300 L410,300 L470,120 L620,120 L620,400 L20,400 Z" fill="#a0aec0"/>
  <!-- water at flood -->
  <path d="M190,180 L450,180 L410,300 L230,300 Z" fill="#63b3ed" opacity="0.8"/>
  <!-- low water -->
  <path d="M222,276 L418,276 L410,300 L230,300 Z" fill="#2b6cb0"/>
  <!-- datum line -->
  <line x1="20" y1="340" x2="620" y2="340" stroke="#4a5568" stroke-dasharray="6 5" stroke-width="2"/>
  <text x="26" y="362" fill="#4a5568">gage datum ("zero" of the staff) = 4,493.22 ft NAVD 88</text>
  <!-- staff -->
  <rect x="500" y="90" width="14" height="250" fill="#fefcbf" stroke="#744210"/>
  <g stroke="#744210">
    <line x1="500" y1="140" x2="508" y2="140"/><line x1="500" y1="190" x2="508" y2="190"/>
    <line x1="500" y1="240" x2="508" y2="240"/><line x1="500" y1="290" x2="508" y2="290"/>
  </g>
  <!-- gage height arrow -->
  <line x1="545" y1="340" x2="545" y2="184" stroke="#c05621" stroke-width="3" marker-end="url(#a)"/>
  <text x="555" y="250" fill="#c05621">gage</text><text x="555" y="270" fill="#c05621">height</text>
  <!-- offset arrow -->
  <line x1="150" y1="340" x2="150" y2="302" stroke="#2f855a" stroke-width="3" marker-end="url(#a2)"/>
  <text x="40" y="318" fill="#2f855a">zero-flow</text><text x="40" y="336" fill="#2f855a">offset 3.20 ft</text>
  <!-- depth arrow -->
  <line x1="320" y1="300" x2="320" y2="184" stroke="#1a365d" stroke-width="3" marker-end="url(#a3)"/>
  <text x="330" y="245" fill="#1a365d" font-weight="600">depth h</text>
  <text x="196" y="170" fill="#1a365d">flood water surface</text>
  <text x="20" y="40" font-size="19" font-weight="600" fill="#1a202c">depth = gage height − zero-flow offset</text>
  <text x="20" y="66" fill="#4a5568">elevation of the water = gage datum + gage height</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c05621"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/></marker>
    <marker id="a3" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a365d"/></marker>
  </defs>
</svg>
