<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Two dice, each showing six</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="s" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="4" dy="6" stdDeviation="5" flood-color="#1a202c" flood-opacity="0.25"/></filter>
  </defs>
  <g transform="translate(40 40) rotate(-8 110 110)" filter="url(#s)">
    <rect width="220" height="220" rx="36" fill="url(#g)" stroke="#2d3748" stroke-width="4"/>
    <g fill="#1a202c">
      <circle cx="60" cy="55" r="20"/><circle cx="160" cy="55" r="20"/>
      <circle cx="60" cy="110" r="20"/><circle cx="160" cy="110" r="20"/>
      <circle cx="60" cy="165" r="20"/><circle cx="160" cy="165" r="20"/>
    </g>
  </g>
  <g transform="translate(300 40) rotate(7 110 110)" filter="url(#s)">
    <rect width="220" height="220" rx="36" fill="url(#g)" stroke="#2d3748" stroke-width="4"/>
    <g fill="#1a202c">
      <circle cx="60" cy="55" r="20"/><circle cx="160" cy="55" r="20"/>
      <circle cx="60" cy="110" r="20"/><circle cx="160" cy="110" r="20"/>
      <circle cx="60" cy="165" r="20"/><circle cx="160" cy="165" r="20"/>
    </g>
  </g>
</svg>
