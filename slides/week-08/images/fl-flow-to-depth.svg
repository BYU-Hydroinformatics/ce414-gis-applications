<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 940" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24">
  <title>From a flow back to a depth, then to a flood map. Every day the gage turns stage into flow through the rating. For a flood we go backwards: a design flow (FEMA's 1%, 2,325 ft³/s, or your own Q), the rating read backwards to a stage of 8.21 ft, minus the zero-flow reading of 3.20 ft to a depth above the river of 1.53 m, and every cell with HAND at or below that depth is wet.</title>
  <rect width="760" height="940" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>

  <!-- every day -->
  <text x="20" y="38" font-size="24" font-weight="600" fill="#4a5568">Every day, at the gage:</text>
  <rect x="20" y="58" width="250" height="84" rx="12" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2.5"/>
  <text x="145" y="94" text-anchor="middle" font-size="28" font-weight="700" fill="#1a365d">stage</text>
  <text x="145" y="124" text-anchor="middle" font-size="19" fill="#4a5568">gage height · water level</text>
  <line x1="276" y1="100" x2="480" y2="100" stroke="#4a5568" stroke-width="3" marker-end="url(#a)"/>
  <text x="378" y="88" text-anchor="middle" font-size="20" fill="#4a5568">the rating</text>
  <rect x="490" y="58" width="250" height="84" rx="12" fill="#fff5eb" stroke="#c05621" stroke-width="2.5"/>
  <text x="615" y="94" text-anchor="middle" font-size="28" font-weight="700" fill="#7b341e">flow</text>
  <text x="615" y="124" text-anchor="middle" font-size="19" fill="#4a5568">discharge · Q</text>

  <line x1="20" y1="176" x2="740" y2="176" stroke="#cbd5e0" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- for a flood, backwards -->
  <text x="20" y="218" font-size="24" font-weight="600" fill="#4a5568">For a flood, read it backwards:</text>

  <rect x="110" y="238" width="540" height="96" rx="12" fill="#fff5eb" stroke="#c05621" stroke-width="2.5"/>
  <text x="380" y="276" text-anchor="middle" font-size="28" font-weight="700" fill="#7b341e">a design flow</text>
  <text x="380" y="312" text-anchor="middle" font-size="22" fill="#1a202c">FEMA's 1%: 2,325 ft³/s, or your own Q</text>

  <line x1="380" y1="336" x2="380" y2="398" stroke="#4a5568" stroke-width="3" marker-end="url(#a)"/>
  <text x="400" y="374" font-size="20" fill="#4a5568">the rating, backwards</text>

  <rect x="110" y="404" width="540" height="96" rx="12" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2.5"/>
  <text x="380" y="442" text-anchor="middle" font-size="28" font-weight="700" fill="#1a365d">stage</text>
  <text x="380" y="478" text-anchor="middle" font-size="22" fill="#1a202c">8.21 ft on the ruler</text>

  <line x1="380" y1="502" x2="380" y2="564" stroke="#4a5568" stroke-width="3" marker-end="url(#a)"/>
  <text x="400" y="540" font-size="20" fill="#4a5568">minus the zero-flow reading, 3.20 ft</text>

  <rect x="110" y="570" width="540" height="110" rx="12" fill="#e6fffa" stroke="#2c7a7b" stroke-width="2.5"/>
  <text x="380" y="608" text-anchor="middle" font-size="28" font-weight="700" fill="#234e52">depth above the river, h</text>
  <text x="380" y="646" text-anchor="middle" font-size="22" fill="#1a202c">8.21 − 3.20 = 5.01 ft = 1.53 m</text>

  <line x1="380" y1="682" x2="380" y2="744" stroke="#4a5568" stroke-width="3" marker-end="url(#a)"/>
  <text x="400" y="720" font-size="20" fill="#4a5568">Tuesday's HAND</text>

  <rect x="110" y="750" width="540" height="96" rx="12" fill="#f0fff4" stroke="#2f855a" stroke-width="2.5"/>
  <text x="380" y="788" text-anchor="middle" font-size="28" font-weight="700" fill="#22543d">every cell with HAND ≤ h</text>
  <text x="380" y="824" text-anchor="middle" font-size="22" fill="#1a202c">is wet: one flow in, one map out</text>

  <text x="380" y="900" text-anchor="middle" font-size="19" fill="#4a5568">Lab 7, Step 1: you do this once, for your own flow.</text>
</svg>
