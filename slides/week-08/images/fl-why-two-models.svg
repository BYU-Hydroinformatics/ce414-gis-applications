<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17">
  <title>Why two models: an iterator reruns every tool in its model, so one model would compute HAND five times</title>
  <rect width="1200" height="560" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker>
  </defs>

  <!-- Panel 1: one model -->
  <rect x="30" y="30" width="1140" height="230" rx="14" fill="#fff5f5" stroke="#c53030" stroke-width="2"/>
  <text x="50" y="64" font-size="22" font-weight="700" fill="#c53030">One model, with the iterator inside</text>
  <text x="50" y="90" font-size="16" fill="#4a5568">ModelBuilder's rule: an iterator runs EVERY tool in its model once per value, not just the tools after it</text>

  <g font-size="14" fill="#1a202c" text-anchor="middle">
    <rect x="60" y="120" width="110" height="50" rx="8" fill="#ffffff" stroke="#c53030" stroke-width="2"/><text x="115" y="141">Iterate</text><text x="115" y="158">Field Values</text>
    <rect x="200" y="120" width="100" height="50" rx="8" fill="#fed7d7" stroke="#4a5568"/><text x="250" y="150">Fill</text>
    <rect x="320" y="120" width="100" height="50" rx="8" fill="#fed7d7" stroke="#4a5568"/><text x="370" y="141">Flow</text><text x="370" y="158">Direction</text>
    <rect x="440" y="120" width="100" height="50" rx="8" fill="#fed7d7" stroke="#4a5568"/><text x="490" y="141">Flow</text><text x="490" y="158">Accumulation</text>
    <rect x="560" y="120" width="100" height="50" rx="8" fill="#fed7d7" stroke="#4a5568"/><text x="610" y="141">Buffer, Extract</text><text x="610" y="158">by Mask</text>
    <rect x="680" y="120" width="100" height="50" rx="8" fill="#fed7d7" stroke="#4a5568"/><text x="730" y="141">Flow</text><text x="730" y="158">Distance</text>
    <rect x="800" y="120" width="100" height="50" rx="8" fill="#ffffff" stroke="#4a5568"/><text x="850" y="141">Con</text><text x="850" y="158">(HAND ≤ h)</text>
    <rect x="920" y="120" width="100" height="50" rx="8" fill="#ffffff" stroke="#4a5568"/><text x="970" y="141">Raster to</text><text x="970" y="158">Polygon…</text>
    <rect x="1040" y="120" width="100" height="50" rx="8" fill="#ffffff" stroke="#4a5568"/><text x="1090" y="150">Merge</text>
  </g>
  <g stroke="#4a5568" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M170,145 L198,145"/><path d="M300,145 L318,145"/><path d="M420,145 L438,145"/><path d="M540,145 L558,145"/><path d="M660,145 L678,145"/><path d="M780,145 L798,145"/><path d="M900,145 L918,145"/><path d="M1020,145 L1038,145"/>
  </g>
  <g font-size="20" font-weight="700" fill="#c53030" text-anchor="middle">
    <text x="250" y="200">×5</text><text x="370" y="200">×5</text><text x="490" y="200">×5</text><text x="610" y="200">×5</text><text x="730" y="200">×5</text>
  </g>
  <g font-size="20" font-weight="700" fill="#4a5568" text-anchor="middle">
    <text x="850" y="200">×5</text><text x="970" y="200">×5</text><text x="1090" y="200">×5</text>
  </g>
  <text x="600" y="240" text-anchor="middle" font-size="17" fill="#c53030" font-weight="600">HAND is recomputed five times and comes out identical each time: about five minutes of waiting for nothing</text>

  <!-- Panel 2: two models -->
  <rect x="30" y="290" width="1140" height="240" rx="14" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/>
  <text x="50" y="324" font-size="22" font-weight="700" fill="#2f855a">Two models: the heavy chain runs once, only the cheap loop repeats</text>

  <rect x="50" y="345" width="620" height="140" rx="12" fill="#ffffff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="360" y="370" text-anchor="middle" font-size="16" font-weight="700" fill="#2b6cb0">Model 1 — HAND Builder</text>
  <!-- callout: data preparation -->
  <path d="M488,452 L656,452 Q668,452 668,464 L668,480 Q668,492 656,492 L500,492 Q488,492 488,480 L488,464 Q488,452 500,452 Z M560,452 L572,440 L584,452 Z" fill="#2b6cb0"/>
  <text x="578" y="478" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">data preparation</text>
  <g font-size="14" fill="#1a202c" text-anchor="middle">
    <rect x="70" y="390" width="100" height="50" rx="8" fill="#e2e8f0" stroke="#4a5568"/><text x="120" y="420">Fill</text>
    <rect x="190" y="390" width="100" height="50" rx="8" fill="#e2e8f0" stroke="#4a5568"/><text x="240" y="411">Flow</text><text x="240" y="428">Direction</text>
    <rect x="310" y="390" width="100" height="50" rx="8" fill="#e2e8f0" stroke="#4a5568"/><text x="360" y="411">Flow</text><text x="360" y="428">Accumulation</text>
    <rect x="430" y="390" width="100" height="50" rx="8" fill="#e2e8f0" stroke="#4a5568"/><text x="480" y="411">Buffer, Extract</text><text x="480" y="428">by Mask</text>
    <rect x="550" y="390" width="100" height="50" rx="8" fill="#e2e8f0" stroke="#4a5568"/><text x="600" y="411">Flow</text><text x="600" y="428">Distance</text>
  </g>
  <g stroke="#4a5568" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M170,415 L188,415"/><path d="M290,415 L308,415"/><path d="M410,415 L428,415"/><path d="M530,415 L548,415"/>
  </g>
  <text x="300" y="476" text-anchor="middle" font-size="16" font-weight="700" fill="#2f855a">×1 · about a minute</text>

  <ellipse cx="712" cy="415" rx="36" ry="22" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/>
  <text x="712" y="420" text-anchor="middle" font-size="15" font-weight="700" fill="#22543d">HAND</text>
  <path d="M670,415 L675,415" stroke="#2b6cb0" stroke-width="2"/>
  <path d="M748,415 L768,415" stroke="#2b6cb0" stroke-width="2.5" fill="none" marker-end="url(#a)"/>

  <rect x="770" y="345" width="380" height="140" rx="12" fill="#ffffff" stroke="#c05621" stroke-width="2"/>
  <text x="960" y="370" text-anchor="middle" font-size="16" font-weight="700" fill="#c05621">Model 2 — Flood Loop</text>
  <!-- callout: the flood model -->
  <path d="M1004,452 L1144,452 Q1156,452 1156,464 L1156,480 Q1156,492 1144,492 L1016,492 Q1004,492 1004,480 L1004,464 Q1004,452 1016,452 Z M1070,452 L1082,440 L1094,452 Z" fill="#c05621"/>
  <text x="1080" y="478" text-anchor="middle" font-size="15.5" font-weight="700" fill="#ffffff">the flood model</text>
  <g font-size="14" fill="#1a202c" text-anchor="middle">
    <rect x="785" y="390" width="80" height="50" rx="8" fill="#ffffff" stroke="#c05621" stroke-width="2"/><text x="825" y="411">Iterate</text><text x="825" y="428">Field Values</text>
    <rect x="880" y="390" width="80" height="50" rx="8" fill="#ffffff" stroke="#4a5568"/><text x="920" y="411">Con</text><text x="920" y="428">(HAND ≤ h)</text>
    <rect x="975" y="390" width="80" height="50" rx="8" fill="#ffffff" stroke="#4a5568"/><text x="1015" y="411">Raster to</text><text x="1015" y="428">Polygon…</text>
    <rect x="1070" y="390" width="65" height="50" rx="8" fill="#ffffff" stroke="#4a5568"/><text x="1102" y="420">Merge</text>
  </g>
  <g stroke="#4a5568" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M865,415 L878,415"/><path d="M960,415 L973,415"/><path d="M1055,415 L1068,415"/>
  </g>
  <text x="885" y="476" text-anchor="middle" font-size="16" font-weight="700" fill="#2f855a">×5 · under a minute in all</text>

  <text x="600" y="515" text-anchor="middle" font-size="17" fill="#1a202c" font-weight="600">Same answer, a fifth of the wait, and each model does one job you can name.</text>
</svg>
