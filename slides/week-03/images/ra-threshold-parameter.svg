<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330"
     font-family="Segoe UI, Avenir Next, Helvetica, Arial, sans-serif" role="img"
     aria-label="Schematic: marking the threshold variable in the NDVI model as a parameter puts a Threshold box on the tool dialog the model produces.">

  <defs>
    <marker id="tp-arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#6a6a6a"/>
    </marker>
    <marker id="tp-big" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#002e5d"/>
    </marker>
  </defs>

  <!-- ================= left: the model canvas ================= -->
  <text x="212" y="26" text-anchor="middle" font-size="21" font-weight="700" fill="#002e5d">In the model</text>
  <rect x="14" y="38" width="396" height="234" rx="8" fill="#f7f9fb" stroke="#c3ccd8" stroke-width="1.5"/>

  <!-- NDVI raster (data: blue oval) -->
  <ellipse cx="98" cy="96" rx="66" ry="27" fill="#bfd7ee" stroke="#4a7fb5" stroke-width="2"/>
  <text x="98" y="93" text-anchor="middle" font-size="16" font-weight="600" fill="#12314f">NDVI</text>
  <text x="98" y="111" text-anchor="middle" font-size="13" fill="#3b5c7d">raster</text>

  <!-- Threshold variable (data oval) with the P marker -->
  <ellipse cx="98" cy="196" rx="66" ry="27" fill="#bfd7ee" stroke="#4a7fb5" stroke-width="2"/>
  <text x="98" y="193" text-anchor="middle" font-size="16" font-weight="600" fill="#12314f">Threshold</text>
  <text x="98" y="211" text-anchor="middle" font-size="13" fill="#3b5c7d">0.4</text>
  <text x="176" y="186" font-size="26" font-weight="800" fill="#e8792b">P</text>

  <!-- arrows into the tool -->
  <line x1="164" y1="104" x2="228" y2="130" stroke="#6a6a6a" stroke-width="2" marker-end="url(#tp-arrow)"/>
  <line x1="164" y1="188" x2="228" y2="162" stroke="#6a6a6a" stroke-width="2" marker-end="url(#tp-arrow)"/>

  <!-- the tool (yellow rounded rect) -->
  <rect x="236" y="122" width="150" height="48" rx="12" fill="#f6e6a8" stroke="#b99a24" stroke-width="2"/>
  <text x="311" y="145" text-anchor="middle" font-size="15" font-weight="600" fill="#5c4a06">Raster</text>
  <text x="311" y="162" text-anchor="middle" font-size="15" font-weight="600" fill="#5c4a06">Calculator</text>

  <text x="212" y="252" text-anchor="middle" font-size="15" fill="#4b5563">
    Right-click the variable ▸ Parameter. The P appears.
  </text>

  <!-- ================= the arrow between panels ================= -->
  <line x1="424" y1="155" x2="474" y2="155" stroke="#002e5d" stroke-width="6" marker-end="url(#tp-big)"/>
  <text x="449" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#002e5d">gives</text>

  <!-- ================= right: the tool dialog ================= -->
  <text x="694" y="26" text-anchor="middle" font-size="21" font-weight="700" fill="#002e5d">On the tool dialog</text>
  <rect x="496" y="38" width="396" height="234" rx="8" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
  <rect x="496" y="38" width="396" height="38" rx="8" fill="#eef3f9"/>
  <rect x="496" y="66" width="396" height="10" fill="#eef3f9"/>
  <text x="516" y="63" font-size="16" font-weight="700" fill="#002e5d">NDVI Threshold</text>

  <!-- field: NDVI raster -->
  <text x="516" y="104" font-size="14" font-weight="600" fill="#3d4654">NDVI raster</text>
  <rect x="516" y="112" width="356" height="30" rx="4" fill="#ffffff" stroke="#9aa6b6" stroke-width="1.5"/>
  <text x="528" y="132" font-size="14" fill="#5d6673">Lab02_NDVI</text>

  <!-- field: Threshold, highlighted as the one the P created -->
  <text x="516" y="168" font-size="14" font-weight="600" fill="#a8551a">Threshold</text>
  <rect x="516" y="176" width="356" height="32" rx="4" fill="#fdf1e7" stroke="#e8792b" stroke-width="2.5"/>
  <text x="528" y="198" font-size="15" font-weight="700" fill="#22262e">0.4</text>

  <!-- field: output -->
  <text x="516" y="234" font-size="14" font-weight="600" fill="#3d4654">Output raster</text>
  <rect x="516" y="242" width="356" height="18" rx="4" fill="#ffffff" stroke="#9aa6b6" stroke-width="1.5"/>

  <text x="694" y="290" text-anchor="middle" font-size="16" font-weight="600" fill="#a8551a">
    Type a number and Run
  </text>

  <text x="450" y="320" text-anchor="middle" font-size="13" fill="#8a94a3">
    Schematic. The panes in ArcGIS Pro do not look exactly like this.
  </text>
</svg>
