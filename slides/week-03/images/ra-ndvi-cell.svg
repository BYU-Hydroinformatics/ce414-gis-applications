<rect x='20' y='16' width='780' height='52' rx='8' fill='#002e5d'/><text x='410' y='50' text-anchor='middle' font-size='24' font-weight='700' fill='#ffffff' font-family='Segoe UI, Helvetica, Arial, sans-serif'>NDVI  =  (NIR − red) ÷ (NIR + red)</text><rect x='40' y='95' width='110' height='110' rx='6' fill='#f4c6c6' stroke='#002e5d' stroke-width='2'/><text x='95' y='162' text-anchor='middle' font-size='30' font-weight='700' fill='#002e5d' font-family='Segoe UI, Helvetica, Arial, sans-serif'>0.09</text><text x='95' y='228' text-anchor='middle' font-size='15' font-weight='400' fill='#5a6472' font-family='Segoe UI, Helvetica, Arial, sans-serif'>red band</text><rect x='170' y='95' width='110' height='110' rx='6' fill='#cfe8ff' stroke='#002e5d' stroke-width='2'/><text x='225' y='162' text-anchor='middle' font-size='30' font-weight='700' fill='#002e5d' font-family='Segoe UI, Helvetica, Arial, sans-serif'>0.47</text><text x='225' y='228' text-anchor='middle' font-size='15' font-weight='400' fill='#5a6472' font-family='Segoe UI, Helvetica, Arial, sans-serif'>NIR band</text><rect x='650' y='95' width='110' height='110' rx='6' fill='#d8f5d0' stroke='#002e5d' stroke-width='2'/><text x='705' y='162' text-anchor='middle' font-size='30' font-weight='700' fill='#002e5d' font-family='Segoe UI, Helvetica, Arial, sans-serif'>0.68</text><text x='705' y='228' text-anchor='middle' font-size='15' font-weight='400' fill='#5a6472' font-family='Segoe UI, Helvetica, Arial, sans-serif'>NDVI</text><text x='302' y='162' text-anchor='middle' font-size='34' font-weight='700' fill='#e8792b' font-family='Segoe UI, Helvetica, Arial, sans-serif'>=</text><text x='402' y='138' text-anchor='middle' font-size='26' font-weight='700' fill='#002e5d' font-family='Segoe UI, Helvetica, Arial, sans-serif'>0.47 − 0.09</text><line x1='318' y1='152' x2='486' y2='152' stroke='#002e5d' stroke-width='2.5'/><text x='402' y='184' text-anchor='middle' font-size='26' font-weight='700' fill='#002e5d' font-family='Segoe UI, Helvetica, Arial, sans-serif'>0.47 + 0.09</text><text x='512' y='162' text-anchor='middle' font-size='34' font-weight='700' fill='#e8792b' font-family='Segoe UI, Helvetica, Arial, sans-serif'>=</text><text x='565' y='138' text-anchor='middle' font-size='26' font-weight='700' fill='#002e5d' font-family='Segoe UI, Helvetica, Arial, sans-serif'>0.38</text><line x1='529' y1='152' x2='601' y2='152' stroke='#002e5d' stroke-width='2.5'/><text x='565' y='184' text-anchor='middle' font-size='26' font-weight='700' fill='#002e5d' font-family='Segoe UI, Helvetica, Arial, sans-serif'>0.56</text><text x='620' y='162' text-anchor='middle' font-size='34' font-weight='700' fill='#e8792b' font-family='Segoe UI, Helvetica, Arial, sans-serif'>=</text><text x='40' y='272' text-anchor='start' font-size='15' font-weight='400' fill='#5a6472' font-family='Segoe UI, Helvetica, Arial, sans-serif'>One cell of a center-pivot field near Elberta in the Lab 2 scene. Two reflectances in, one number out,</text><text x='40' y='294' text-anchor='start' font-size='15' font-weight='400' fill='#5a6472' font-family='Segoe UI, Helvetica, Arial, sans-serif'>and the six million other cells get the same treatment with no reference to their neighbors.</text>
