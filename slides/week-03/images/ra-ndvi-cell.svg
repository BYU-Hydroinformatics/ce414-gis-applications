<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 340' width='700' height='340'>
<rect width='700' height='340' fill='#ffffff'/>
<rect x='20' y='20' width='660' height='60' rx='8' fill='#002e5d'/><text x='350' y='58' text-anchor='middle' font-size='24' font-weight='700' fill='#ffffff' font-family='Segoe UI, Helvetica, Arial, sans-serif'>NDVI  =  (NIR − red) ÷ (NIR + red)</text><rect x='60' y='120' width='120' height='120' rx='6' fill='#f4c6c6' stroke='#002e5d' stroke-width='2'/><text x='120' y='195' text-anchor='middle' font-size='30' font-weight='700' fill='#002e5d' font-family='Segoe UI, Helvetica, Arial, sans-serif'>0.09</text><text x='120' y='262' text-anchor='middle' font-size='15' font-weight='400' fill='#5a6472' font-family='Segoe UI, Helvetica, Arial, sans-serif'>red band</text><text x='240' y='190' text-anchor='middle' font-size='34' font-weight='700' fill='#e8792b' font-family='Segoe UI, Helvetica, Arial, sans-serif'>+</text><rect x='300' y='120' width='120' height='120' rx='6' fill='#cfe8ff' stroke='#002e5d' stroke-width='2'/><text x='360' y='195' text-anchor='middle' font-size='30' font-weight='700' fill='#002e5d' font-family='Segoe UI, Helvetica, Arial, sans-serif'>0.47</text><text x='360' y='262' text-anchor='middle' font-size='15' font-weight='400' fill='#5a6472' font-family='Segoe UI, Helvetica, Arial, sans-serif'>NIR band</text><text x='480' y='190' text-anchor='middle' font-size='34' font-weight='700' fill='#e8792b' font-family='Segoe UI, Helvetica, Arial, sans-serif'>→</text><rect x='540' y='120' width='120' height='120' rx='6' fill='#d8f5d0' stroke='#002e5d' stroke-width='2'/><text x='600' y='195' text-anchor='middle' font-size='30' font-weight='700' fill='#002e5d' font-family='Segoe UI, Helvetica, Arial, sans-serif'>0.68</text><text x='600' y='262' text-anchor='middle' font-size='15' font-weight='400' fill='#5a6472' font-family='Segoe UI, Helvetica, Arial, sans-serif'>NDVI</text><text x='60' y='300' text-anchor='start' font-size='15' font-weight='400' fill='#5a6472' font-family='Segoe UI, Helvetica, Arial, sans-serif'>One cell of a center-pivot field near Elberta in the Lab 2 scene. Reflectance in, one number out,</text><text x='60' y='322' text-anchor='start' font-size='15' font-weight='400' fill='#5a6472' font-family='Segoe UI, Helvetica, Arial, sans-serif'>and the six million other cells get the same two-line treatment with no reference to their neighbors.</text>
</svg>
