<text x='455.0' y='40' text-anchor='middle' font-size='16' font-weight='700' fill='#002e5d' font-family='Segoe UI, Helvetica, Arial, sans-serif'>3 × 3 mean</text><text x='30' y='310' text-anchor='start' font-size='15' font-weight='400' fill='#5a6472' font-family='Segoe UI, Helvetica, Arial, sans-serif'>Nine cells in, one cell out: (3 + 3 + 4 + 3 + 9 + 4 + 3 + 4 + 4) ÷ 9 = 4.1</text><text x='30' y='334' text-anchor='start' font-size='15' font-weight='400' fill='#5a6472' font-family='Segoe UI, Helvetica, Arial, sans-serif'>The window then steps one cell to the right and does it again. The spike of 9 is smoothed to 4.1.</text><text x='30' y='358' text-anchor='start' font-size='15' font-weight='400' fill='#5a6472' font-family='Segoe UI, Helvetica, Arial, sans-serif'>At the grid edge the window hangs off the data: border cells are NoData unless the tool is told otherwise.</text>
