<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" width="980" height="360" font-family="Segoe UI, Avenir Next, Helvetica, Arial, sans-serif" role="img" aria-label="Oval means data, rectangle means tool. A valid chain runs data to tool to data. Tool into tool and data into data are both crossed out.">
<text x="26" y="34" font-size="21" font-weight="700" fill="#002e5d">Shape tells you which</text>
