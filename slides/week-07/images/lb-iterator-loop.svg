<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 470' width='1200' height='470' role='img' aria-label='A ModelBuilder loop over water levels'><rect width='1200' height='470' fill='white'/><defs><marker id='a' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='6' markerHeight='6' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#5b6770'/></marker></defs><text x='40' y='40' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif' font-size='26' font-weight='bold' fill='#002e5d' text-anchor='start'>One model, run once per water level</text><rect x='40' y='110' width='200' height='90' rx='14' fill='#fff4e0' stroke='#e07a1f' stroke-width='2'/><text x='140.0' y='149.0' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif' font-size='20' font-weight='bold' fill='#e07a1f' text-anchor='middle'>For</text><text x='140.0' y='175.0' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif' font-size='15' font-weight='normal' fill='#5b6770' text-anchor='middle'>4,190 to 4,210 by 2</text><rect x='300' y='110' width='150' height='90' rx='14' fill='#e3eef8' stroke='#002e5d' stroke-width='2'/><text x='375.0' y='149.0' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif' font-size='20' font-weight='bold' fill='#002e5d' text-anchor='middle'>Value</text><text x='375.0' y='175.0' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif' font-size='15' font-weight='normal' fill='#5b6770' text-anchor='middle'>this run's level</text><rect x='510' y='110' width='220' height='90' rx='14' fill='#fff8d6' stroke='#002e5d' stroke-width='2'/><text x='620.0' y='149.0' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif' font-size='20' font-weight='bold' fill='#002e5d' text-anchor='middle'>Raster Calculator</text><text x='620.0' y='175.0' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif' font-size='15' font-weight='normal' fill='#5b6770' text-anchor='middle'>Con(surface ≤ %Value%, 1)</text><rect x='790' y='110' width='170' height='90' rx='14' fill='#fff8d6' stroke='#002e5d' stroke-width='2'/><text x='875.0' y='149.0' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif' font-size='20' font-weight='bold' fill='#002e5d' text-anchor='middle'>Raster to</text><text x='875.0' y='175.0' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif' font-size='15' font-weight='normal' fill='#5b6770' text-anchor='middle'>Polygon</text><rect x='1010' y='110' width='160' height='90' rx='14' fill='#e7f3e3' stroke='#3c8d3a' stroke-width='2'/><text x='1090.0' y='149.0' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif' font-size='20' font-weight='bold' fill='#3c8d3a' text-anchor='middle'>Lake_%Value%</text><text x='1090.0' y='175.0' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif' font-size='15' font-weight='normal' fill='#5b6770' text-anchor='middle'>one per level</text><rect x='510' y='320' width='220' height='90' rx='14' fill='#fff8d6' stroke='#002e5d' stroke-width='2'/><text x='620.0' y='365.0' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif' font-size='20' font-weight='bold' fill='#002e5d' text-anchor='middle'>Collect Values</text><rect x='820' y='320' width='300' height='90' rx='14' fill='#e7f3e3' stroke='#3c8d3a' stroke-width='2'/><text x='970.0' y='359.0' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif' font-size='20' font-weight='bold' fill='#3c8d3a' text-anchor='middle'>Merge → Shorelines</text><text x='970.0' y='385.0' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif' font-size='15' font-weight='normal' fill='#5b6770' text-anchor='middle'>all levels, one feature class</text><line x1='240' y1='155' x2='300' y2='155' stroke='#5b6770' stroke-width='3' marker-end='url(#a)'/><line x1='450' y1='155' x2='510' y2='155' stroke='#5b6770' stroke-width='3' marker-end='url(#a)'/><line x1='730' y1='155' x2='790' y2='155' stroke='#5b6770' stroke-width='3' marker-end='url(#a)'/><line x1='960' y1='155' x2='1010' y2='155' stroke='#5b6770' stroke-width='3' marker-end='url(#a)'/><path d='M1090,200 L1090,260 L620,260 L620,320' fill='none' stroke='#5b6770' stroke-width='3' marker-end='url(#a)'/><line x1='730' y1='365' x2='820' y2='365' stroke='#5b6770' stroke-width='3' marker-end='url(#a)'/><path d='M140,200 C140,300 300,300 360,220' fill='none' stroke='#e07a1f' stroke-width='3' stroke-dasharray='7 5' marker-end='url(#a)'/><text x='150' y='330' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif' font-size='17' font-weight='normal' fill='#e07a1f' text-anchor='start'>next level, until the list is done</text><text x='40' y='450' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif' font-size='15' font-weight='normal' fill='#5b6770' text-anchor='start'>A sketch of the Lab 6 model; the tool names and settings are confirmed in ArcGIS Pro when the model is built.</text></svg>